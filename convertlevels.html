    <script>
        
        // animated favicon
        (function() {
            let spritejson = null; let sheetloaded = false;
            let favicons = []; let index = 0; const delay = 300;
            let sheetimg = null;

            fetch("/assets/images/icon.json")
                .then(response => response.json()).then(data => {
                    spritejson = data.frames; sheetimg = new Image();
                    sheetimg.onload = () => {
                        sheetloaded = true;
                        const canvas = document.createElement("canvas");
                        const ctx = canvas.getContext("2d");
                        favicons = spritejson.map(frame => {
                            canvas.width = frame.frame.w;
                            canvas.height = frame.frame.h;
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            ctx.drawImage(
                                sheetimg,
                                frame.frame.x, frame.frame.y, frame.frame.w, frame.frame.h,
                                0, 0, frame.frame.w, frame.frame.h
                            ); return canvas.toDataURL("image/png");
                        }); favicongif();
                    }; sheetimg.src = "/assets/images/icon.webp";
                });
            function favicongif() {
                if (!sheetloaded || favicons.length === 0) {setTimeout(favicongif, 50); return}
                const link = document.querySelector("link[rel='icon']") || document.createElement("link");
                link.rel = "icon"; link.href = favicons[index];
                document.head.appendChild(link);
                index = (index + 1) % favicons.length;
                setTimeout(favicongif, delay);
            }
        })();

        // loading
        window.addEventListener("load", function() {
            var loading = document.querySelector(".loading");
            if (loading) {
                loading.style.opacity = "0";
                setTimeout(function() {
                    if (loading.parentNode) {loading.parentNode.removeChild(loading)}
                }, 500);
            }
        });

        // click sfx
        document.querySelectorAll(".clickable").forEach(function(element) {
            element.addEventListener("click", function() {
                document.querySelector(".click").currentTime = 0;
                document.querySelector(".click").play();
            });
        });

        /*//////////////////////////////////////////////////////////////////////*/

        function savecursorpos(element) {
            const selection = window.getSelection();
            if (selection.rangeCount === 0) return null;
            const range = selection.getRangeAt(0);
            const precaretrange = range.cloneRange();
            precaretrange.selectNodeContents(element);
            precaretrange.setEnd(range.endContainer, range.endOffset);
            return precaretrange.toString().length;
        }

        function restorecursorpos(element, offset) {
            if (offset === null || offset === undefined) return;
            try {
                const selection = window.getSelection();
                const range = document.createRange();
                const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT, null, false);
                let cur = 0;
                let node;
                while (node = walker.nextNode()) {
                    const len = node.textContent.length;
                    if (cur + len >= offset) {
                        range.setStart(node, Math.max(0, offset - cur));
                        range.collapse(true);
                        selection.removeAllRanges();
                        selection.addRange(range);
                        break;
                    }
                    cur += len;
                }
            } catch (e) {}
        }

        // xml highlighting
        function highlight(element) {
            if (!element || !Prism) return;
            const text = element.textContent || element.innerText || "";
            if (!text.trim()) {
                element.innerHTML = "";
                return;
            }
            const cursorpos = savecursorpos(element);
            try {
                const highlighted = Prism.highlight(text, Prism.languages.xml, 'xml');
                element.innerHTML = highlighted;
                if (cursorpos !== null) {
                    restorecursorpos(element, cursorpos);
                }
            } catch (e) {
                console.error("prism.js error?!", e);
                element.textContent = text;
            }
        }

        // json highlighting
        function highlightjson(element) {
            if (!element || !Prism) return;
            const text = element.textContent || element.innerText || "";
            if (!text.trim()) {
                element.innerHTML = "";
                return;
            }
            const cursorpos = savecursorpos(element);
            try {
                const highlighted = Prism.highlight(text, Prism.languages.json, 'json');
                element.innerHTML = highlighted;
                if (cursorpos !== null) {
                    restorecursorpos(element, cursorpos);
                }
            } catch (e) {
                console.error("prism.js error?!", e);
                element.textContent = text;
            }
        }

        /*//////////////////////////////////////////////////////////////////////*/

        // conversion functions
        function convertxmltojson(xmlstring) {
            try {
                const parser = new DOMParser();
                const xmldoc = parser.parseFromString(xmlstring, "text/xml");
                const mapelement = xmldoc.querySelector("map");
                
                if (!mapelement) {
                    throw new Error("no <map> element found in xml");
                }
                const level = {
                    settings: [],
                    objects: []
                };
                
                const settingslayer = mapelement.querySelector("layer[name='settings']");
                if (settingslayer) {
                    const mapsettings = settingslayer.querySelector("map");
                    if (mapsettings) {
                        level.settings.push({
                            name: 0,
                            height: parseInt(mapsettings.getAttribute("height")) || 480,
                            gridSize: parseInt(mapsettings.getAttribute("gridSize")) || 32,
                            width: parseInt(mapsettings.getAttribute("width")) || 320
                        });
                    }
                    
                    const gamedesign = settingslayer.querySelector("gameDesign");
                    if (gamedesign) {
                        const gamedesignsettings = {
                            name: 1,
                            ropePhysicsSpeed: parseFloat(gamedesign.getAttribute("ropePhysicsSpeed")) || 1,
                            special: parseInt(gamedesign.getAttribute("special")) || 1,
                            twoParts: gamedesign.getAttribute("twoParts") === "true"
                        };
                        
                        gamedesignsettings.special = 2;
                            
                        if (gamedesign.getAttribute("twoParts") !== "true") {
                            delete gamedesignsettings.twoParts;
                        }
                        
                        if (gamedesign.getAttribute("nightLevel")) gamedesignsettings.nightLevel = gamedesign.getAttribute("nightLevel") === "true";
                        if (gamedesign.getAttribute("water")) gamedesignsettings.water = parseInt(gamedesign.getAttribute("water"));
                        if (gamedesign.getAttribute("waterSpeed")) gamedesignsettings.waterSpeed = parseInt(gamedesign.getAttribute("waterSpeed"));
                        
                        level.settings.push(gamedesignsettings);
                    }
                }
                
                const objectlayer = mapelement.querySelector("layer[name='Objects']");
                if (objectlayer) {
                    const objects = objectlayer.querySelectorAll("*");
                    let objectcount = 0;
                    
                    objects.forEach(obj => {
                        const tagname = obj.tagName.toLowerCase();
                        const x = parseInt(obj.getAttribute("x")) || 0;
                        const y = parseInt(obj.getAttribute("y")) || 0;
                        
                        let ctrobject = { name: 0, x: x, y: y };
                        
                        const idmapping = window.ctrconversion?.getidmapping();
                        const jsonid = idmapping?.xmltojson?.[tagname];
                        if (jsonid === undefined) {
                            return;
                        }
                        ctrobject.name = jsonid;
                        
                        if (window.ctrconversion?.specialattributes) {
                            window.ctrconversion.specialattributes(ctrobject, tagname, obj);
                        }
                        
                        level.objects.push(ctrobject); objectcount++;
                    });
                }
                
                if (level.settings.length === 0) {
                    level.settings = [
                        { name: 0, height: 480, gridSize: 32, width: 320 },
                        { name: 1, ropePhysicsSpeed: 1, special: 2 }
                    ];
                }
                
                return level;
            } catch (error) {
                console.error("error while converting:", error);
                throw error;
            }
        }

        function convertjsontoxml(jsonobj) {
            try {
                let xml = "<map>\n";
                
                // settings layer
                xml += "<layer name=\"settings\">\n";
                const mapsettings = jsonobj.settings?.find(s => s.name === 0);
                if (mapsettings) {
                    xml += `<map gridSize="${mapsettings.gridSize || 32}" width="${mapsettings.width || 320}" height="${mapsettings.height || 480}" />\n`;
                } else {
                    xml += "<map gridSize=\"32\" width=\"320\" height=\"480\" />\n";
                }
                
                const gamedesign = jsonobj.settings?.find(s => s.name === 1);
                if (gamedesign) {
                    let gdattrs = `ropePhysicsSpeed="${gamedesign.ropePhysicsSpeed || 1.0}" special="${gamedesign.special || 1}"`;
                    if (gamedesign.twoParts !== undefined) gdattrs += ` twoParts="${gamedesign.twoParts}"`;
                    if (gamedesign.nightLevel !== undefined) gdattrs += ` nightLevel="${gamedesign.nightLevel}"`;
                    if (gamedesign.water !== undefined) gdattrs += ` water="${gamedesign.water}"`;
                    if (gamedesign.waterSpeed !== undefined) gdattrs += ` waterSpeed="${gamedesign.waterSpeed}"`;
                    xml += `<gameDesign ${gdattrs} />\n`;
                } else {
                    xml += "<gameDesign ropePhysicsSpeed=\"1.0\" special=\"1\" twoParts=\"false\" />\n";
                }
                xml += "</layer>\n";
                
                // objects layer
                xml += "<layer name=\"Objects\">\n";
                if (jsonobj.objects) {
                    jsonobj.objects.forEach(obj => {
                        const jsontoxml = window.ctrconversion?.getjsontoxml?.();
                        const tagname = jsontoxml?.[String(obj.name)];
                        if (!tagname) return;
                        
                        let attrs = `x="${obj.x || 0}" y="${obj.y || 0}"`;
                        if (obj.timeout !== undefined) attrs += ` timeout="${obj.timeout}"`;
                        if (obj.angle !== undefined) attrs += ` angle="${obj.angle}"`;
                        if (obj.size !== undefined) attrs += ` size="${obj.size}"`;
                        if (obj.group !== undefined) attrs += ` group="${obj.group}"`;
                        if (obj.radius !== undefined) attrs += ` radius="${obj.radius}"`;
                        if (obj.path !== undefined) attrs += ` path="${obj.path}"`;
                        if (obj.moveSpeed !== undefined) attrs += ` moveSpeed="${obj.moveSpeed}"`;
                        if (obj.initialDelay !== undefined) attrs += ` initialDelay="${obj.initialDelay}"`;
                        if (obj.offTime !== undefined) attrs += ` offTime="${obj.offTime}"`;
                        if (obj.onTime !== undefined) attrs += ` onTime="${obj.onTime}"`;
                        if (obj.toggled !== undefined) attrs += ` toggled="${obj.toggled}"`;
                        if (obj.rotateSpeed !== undefined) attrs += ` rotateSpeed="${obj.rotateSpeed}"`;
                        if (obj.oneHandle !== undefined) attrs += ` oneHandle="${obj.oneHandle}"`;
                        if (obj.handleAngle !== undefined) attrs += ` handleAngle="${obj.handleAngle}"`;
                        if (obj.bouncer !== undefined) attrs += ` bouncer="${obj.bouncer}"`;
                        if (obj.bubble !== undefined) attrs += ` bubble="${obj.bubble}"`;
                        if (obj.grab !== undefined) attrs += ` grab="${obj.grab}"`;
                        if (obj.candyCaptured !== undefined) attrs += ` candyCaptured="${obj.candyCaptured}"`;
                        if (obj.activeTime !== undefined) attrs += ` activeTime="${obj.activeTime}"`;
                        if (obj.index !== undefined) attrs += ` index="${obj.index}"`;
                        if (obj.litRadius !== undefined) attrs += ` litRadius="${obj.litRadius}"`;
                        if (obj.bulbNumber !== undefined) attrs += ` bulbNumber="${obj.bulbNumber}"`;
                        if (obj.direction !== undefined) attrs += ` direction="${obj.direction}"`;
                        if (obj.type !== undefined) attrs += ` type="${obj.type}"`;
                        if (obj.width !== undefined) attrs += ` width="${obj.width}"`;
                        if (obj.length !== undefined) attrs += ` length="${obj.length}"`;
                        if (obj.velocity !== undefined) attrs += ` velocity="${obj.velocity}"`;
                        if (obj.spider !== undefined) attrs += ` spider="${obj.spider}"`;
                        if (obj.gun !== undefined) attrs += ` gun="${obj.gun}"`;
                        if (obj.wheel !== undefined) attrs += ` wheel="${obj.wheel}"`;
                        if (obj.part !== undefined) attrs += ` part="${obj.part}"`;
                        if (obj.hidePath !== undefined) attrs += ` hidePath="${obj.hidePath}"`;
                        if (obj.moveOffset !== undefined) attrs += ` moveOffset="${obj.moveOffset}"`;
                        if (obj.moveVertical !== undefined) attrs += ` moveVertical="${obj.moveVertical}"`;
                        if (obj.moveLength !== undefined) attrs += ` moveLength="${obj.moveLength}"`;
                        if (obj.kickable !== undefined) attrs += ` kickable="${obj.kickable}"`;
                        if (obj.kicked !== undefined) attrs += ` kicked="${obj.kicked}"`;
                        if (obj.invisible !== undefined) attrs += ` invisible="${obj.invisible}"`;
                        if (obj.helicopter !== undefined) attrs += ` helicopter="${obj.helicopter}"`;
                        if (obj.bindBulb !== undefined) attrs += ` bindBulb="${obj.bindBulb}"`;
                        if (obj.text !== undefined) attrs += ` text="${obj.text}"`;
                        if (obj.height !== undefined) attrs += ` height="${obj.height}"`;
                        if (obj.locale !== undefined) attrs += ` locale="${obj.locale}"`;
                        if (obj.special !== undefined) attrs += ` special="${obj.special}"`;
                        
                        xml += `<${tagname} ${attrs} />\n`;
                    });
                }
                xml += "</layer>\n";
                xml += "</map>";
                
                return xml;
            } catch (error) {
                console.error("error while converting JSON to XML:", error);
                throw error;
            }
        }

        let converting = false;
        
        const xmleditor = document.querySelector(".thexml");
        const jsoneditor = document.querySelector(".thejson");
        
        if (xmleditor) {
            highlight(xmleditor);
            xmleditor.addEventListener("input", function() {
                clearTimeout(this._t); this._t = setTimeout(() => {
                    highlight(this);
                    if (!converting) {
                        converting = true;
                        try {
                            const xmltext = this.textContent.trim();
                            if (xmltext) {
                                const jsonobj = convertxmltojson(xmltext);
                                const jsonstr = JSON.stringify(jsonobj, null, 2);
                                jsoneditor.textContent = jsonstr;
                                highlightjson(jsoneditor);
                            }
                        } catch (e) {
                            console.error("xml2json error?!", e);
                        }
                        converting = false;
                    }
                }, 300);
            });
            xmleditor.addEventListener("paste", function() {
                setTimeout(() => {
                    highlight(this);
                    if (!converting) {
                        converting = true;
                        try {
                            const xmltext = this.textContent.trim();
                            if (xmltext) {
                                const jsonobj = convertxmltojson(xmltext);
                                const jsonstr = JSON.stringify(jsonobj, null, 2);
                                jsoneditor.textContent = jsonstr;
                                highlightjson(jsoneditor);
                            }
                        } catch (e) {
                            console.error("xml2json error?!", e);
                        }
                        converting = false;
                    }
                }, 10);
            });
        }

        if (jsoneditor) {
            highlightjson(jsoneditor);
            jsoneditor.addEventListener("input", function() {
                clearTimeout(this._t); this._t = setTimeout(() => {
                    highlightjson(this);
                    if (!converting) {
                        converting = true;
                        try {
                            const jsontext = this.textContent.trim();
                            if (jsontext) {
                                const jsonobj = JSON.parse(jsontext);
                                const xmlstr = convertjsontoxml(jsonobj);
                                xmleditor.textContent = xmlstr;
                                highlight(xmleditor);
                            }
                        } catch (e) {
                            console.error("json2xml error?!", e);
                        }
                        converting = false;
                    }
                }, 300);
            });
            jsoneditor.addEventListener("paste", function() {
                setTimeout(() => {
                    highlightjson(this);
                    if (!converting) {
                        converting = true;
                        try {
                            const jsontext = this.textContent.trim();
                            if (jsontext) {
                                const jsonobj = JSON.parse(jsontext);
                                const xmlstr = convertjsontoxml(jsonobj);
                                xmleditor.textContent = xmlstr;
                                highlight(xmleditor);
                            }
                        } catch (e) {
                            console.error("conversion error?! ", e);
                        }
                        converting = false;
                    }
                }, 10);
            });
        }

        // file loading
        const xmlpicker = document.querySelector(".xmlfile");
        const loadxmllink = document.querySelector(".loadxmllink");
        const jsonpicker = document.querySelector(".jsonfile");
        const loadjsonlink = document.querySelector(".loadjsonlink");
        if (xmlpicker && loadxmllink) {
            loadxmllink.addEventListener("click", function(e) {
                e.preventDefault();
                xmlpicker.click();
            });
            xmlpicker.addEventListener("change", e => {
                const f = e.target.files[0];
                if (f) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const content = e.target.result || "";
                        xmleditor.textContent = content;
                        highlight(xmleditor);
                        if (!converting) {
                            converting = true;
                            try {
                                const jsonobj = convertxmltojson(content);
                                const jsonstr = JSON.stringify(jsonobj, null, 2);
                                jsoneditor.textContent = jsonstr;
                                highlightjson(jsoneditor);
                            } catch (err) {
                                console.error("xml2json error?!", err);
                            }
                            converting = false;
                        }
                    };
                    reader.readAsText(f);
                }
                e.target.value = "";
            });
        }
        if (jsonpicker && loadjsonlink) {
            loadjsonlink.addEventListener("click", function(e) {
                e.preventDefault();
                jsonpicker.click();
            });
            jsonpicker.addEventListener("change", e => {
                const f = e.target.files[0];
                if (f) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const content = e.target.result || "";
                        if (!converting) {
                            converting = true;
                            try {
                                const jsonobj = JSON.parse(content);
                                const jsonstr = JSON.stringify(jsonobj, null, 2);
                                const xmlstr = convertjsontoxml(jsonobj);
                                jsoneditor.textContent = jsonstr;
                                xmleditor.textContent = xmlstr;
                                highlightjson(jsoneditor);
                                highlight(xmleditor);
                            } catch (err) {
                                console.error("load/conversion error?!", err);
                            }
                            converting = false;
                        }
                    };
                    reader.readAsText(f);
                }
                e.target.value = "";
            });
        }

    </script>
</body>
</html>
