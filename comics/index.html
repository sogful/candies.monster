        /*//////////////////////////////////////////////////////////////////////*/

        .page {
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;

        }

        .title {
            font-size: 2em;

            text-shadow: 0 0.15em 0 black;
            paint-order: stroke fill;
        }

        .tiny {
            position: fixed; bottom: 0.3em; width: 90%;
            text-align: center;
            color: rgb(223, 223, 223); font-size: 0.5em;
            -webkit-text-stroke: 0.175em black;
            text-shadow: 0 0.15em 0 black;
            paint-order: stroke fill;
        }

        /*//////////////////////////////////////////////////////////////////////*/

        .sbutton {
            display: flex; position: fixed; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: pointer; background: none; z-index: 999;
            border: none; padding: 0; bottom: 1.75em;
        }
        .sbutton img {height: 4em}

        .sbutton span {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff; font-size: 2em;
            -webkit-text-stroke: 0.15em black;
            text-shadow: 0 0.15em 0 black;
            paint-order: stroke fill;
            pointer-events: none;
            white-space: nowrap; user-select: none;
        }

        /*//////////////////////////////////////////////////////////////////////*/

        .thumbnailgrid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: 1fr;
            gap: 1.5em; width: 100%; max-width: 1200px;
            height: min(85vh, 700px); padding: 1em;
            justify-content: center; align-items: center;
        }

        @media (max-aspect-ratio: 3/4) {
            .thumbnailgrid {
                grid-template-columns: repeat(3, 1fr);
                grid-template-rows: repeat(2, 1fr);
            }
        }

        .thumbnail {
            width: 100%; height: 100%;
            max-width: 300px; max-height: 400px;
            object-fit: contain; cursor: pointer;
            transition: transform 0.2s; overflow: hidden;
        }

        .thumbnailcontainer {
            position: relative; display: flex;
            align-items: center; justify-content: center;
            width: 100%; height: 100%;
        }

        .pageviewer {
            display: none; position: fixed;
            justify-content: center; align-items: center;
            top: 0; left: 0; z-index: 1000;
            width: 100vw; height: 100vh;
        }
        .pageviewer.active {
            display: flex;
        }
        .pagedisplay {
            position: relative; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            width: 100%; height: 100%;
        }

        .pagecontainer {
            position: relative; display: flex;
            align-items: center; justify-content: center;
            width: 100%; height: 100%;

            align-items: center; justify-content: center;
            width: 90px; height: 70px;
            border: none; background: none;
            cursor: pointer; z-index: 1000;

        .arrowleft {
            left: 2em;
            transform: rotate(-90deg);
        }
        .arrowright {
            right: 2em;
            transform: rotate(-90deg);
        }
        .arrowbutton img {
            width: 100%;
            height: 100%;
        }

        /*//////////////////////////////////////////////////////////////////////*/

        .backbutton {
            position: absolute; display: flex;
            align-items: center; justify-content: center;
            top: 1em; left: 1em; z-index: 11111;

    </style> <div class="nojs">
    <div class="nojsbg"></div> <img src="/assets/images/nojs.webp" draggable="false">
    <a>Please enable Javascript in your browser to use this page.</a></div></noscript>

    <div class="page">
        <div class="thumbnailgrid">

            <div class="thumbnailcontainer clickable" chapter="1">
                <img class="thumbnail" src="assets/images/ch1.png">
            </div>
            <div class="thumbnailcontainer clickable" chapter="2">
                <img class="thumbnail" src="assets/images/ch2.png">
            </div>
            <div class="thumbnailcontainer clickable" chapter="3">
                <img class="thumbnail" src="assets/images/ch3.png">
            </div>
            <div class="thumbnailcontainer clickable" chapter="4">
                <img class="thumbnail" src="assets/images/ch4.png">
            </div>

            <div class="thumbnailcontainer comingsoon">
                <img class="thumbnail" src="assets/images/comingsoon.png"
                     onmouseover="this.src='assets/images/comingnever.png'"
                     onmouseout="this.src='assets/images/comingsoon.png'">
            </div>
        </div>
    </div>

    <div class="pageviewer">
        <div class="pagedisplay">
            <button class="backbutton clickable">
                <img src="assets/images/back.png">
            </button>
            <div class="pagecontainer">
                <button class="arrowbutton arrowleft clickable">
                    <img src="/levels/assets/images/controls/up.png">
                </button>
                <img class="pageimg" src="" alt="">
                <button class="arrowbutton arrowright clickable">
                    <img src="/levels/assets/images/controls/down.png">
                </button>
            </div>
        </div>
    </div>

    <script>
        
        // click sfx
        document.querySelectorAll(".clickable").forEach(function(element) {
            element.addEventListener("click", function() {
                document.querySelector(".click").currentTime = 0;
                document.querySelector(".click").play();
            });
        });

        /*//////////////////////////////////////////////////////////////////////*/

        // chapter data
        const chapters = {
            1: {pages: ["ch1p1","ch1p2","ch1p3"]},
            2: {pages: ["ch2p1","ch2p2"]},
            3: {pages: ["ch3p1"]},
            4: {pages: ["ch4p1","ch4p2"]}
        };

        let currentchapter = null, currentpage = 0;
        const pageviewer = document.querySelector(".pageviewer"),
              pageimg = document.querySelector(".pageimg"),
              thumbnailgrid = document.querySelector(".thumbnailgrid");

        function showpageviewer(chap) {
            currentchapter = chap;
            currentpage = 0;
            updatepage();
            pageviewer.classList.add("active");
            thumbnailgrid.style.display = "none";
        }
        function hidepageviewer() {
            pageviewer.classList.remove("active");
            thumbnailgrid.style.display = "grid";
            thumbnailgrid.style.gridTemplateColumns = "";
            thumbnailgrid.style.gridTemplateRows = "";
        }

        function updatepage() {
            const c = chapters[currentchapter];
            if (c?.pages[currentpage]) {
                const name = c.pages[currentpage];
                pageimg.src = `assets/images/${name}.png`;
                pageimg.alt = name;
            }
        }
        function changepage(dir) {
            if (!currentchapter) return;
            const p = chapters[currentchapter].pages;
            currentpage = (currentpage + dir + p.length) % p.length;
            updatepage();
        }

        document.querySelectorAll(".thumbnailcontainer[chapter]").forEach(c =>
            c.addEventListener("click", function() {
                showpageviewer(parseInt(this.getAttribute("chapter")));
            })
        );

        document.querySelector(".backbutton").onclick = hidepageviewer;
        document.querySelector(".arrowleft").onclick = () => changepage(-1);
        document.querySelector(".arrowright").onclick = () => changepage(1);

        document.addEventListener("keydown", e => {
            if (!pageviewer.classList.contains("active")) return;
            if (e.key === "ArrowLeft") changepage(-1);
            else if (e.key === "ArrowRight") changepage(1);
            else if (e.key === "Escape") hidepageviewer();
        });

        let touchX = 0;
        pageimg.addEventListener("touchstart", e => touchX = e.changedTouches[0].screenX);
        pageimg.addEventListener("touchend", e => {
            const d = e.changedTouches[0].screenX - touchX;
            if (d < -50) changepage(1);
            else if (d > 50) changepage(-1);
        });

        function updatethumbnaillayout() {
            if (thumbnailgrid && !pageviewer.classList.contains("active")) {
                thumbnailgrid.style.gridTemplateColumns = "";
                thumbnailgrid.style.gridTemplateRows = "";
            }
        };  window.addEventListener("resize", updatethumbnaillayout);
                
    </script>
