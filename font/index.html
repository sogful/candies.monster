    <audio class="click" src="/assets/audio/tap.mp3" preload="auto"></audio>

    <div class="loading">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
            <path fill="#fbfbfb" d="M89 15h22l17 4 14 6 10 7 10 9 9 11 6 11 4 9 3 14 1 9v9l-3 19-5 14-8 13-11 12-9 8-17 9-21 5H89l-18-4-16-8-6-4-10-9-9-10-6-10-6-16-2-9-1-17 2-16 4-14 5-10 6-9 9-10 9-8 16-9 18-5Zm1 18-12 3-16 8-7 6v1l17 1 13 4 9 6 6 8 3 7v5l-4 1-9-6-4-1H74l-6 2-8 4-9 6-8 11-5 16-1 8 6 12 7 9h2l9-19 10-14 9-10 7-5 3-1h7l-1 5-7 6-4 8-2 6v13l4 14 7 9 6 5 8 4h8l14-5 10-7 4-4-21-9-8-6-7-7-5-10-2-8v-8l5-1 5 9 7 6 11 2 13-3 11-6 9-8 4-6v-8l-6-17-7-10-5-5-5 12-6 10-8 10-10 8-5 1-1-5 6-13 1-4V59l-4-10-6-9-8-7Z"/>
            <path fill="#080808" d="M90 29h13l8 7 7 8 5 10 1 6v14l-4 11-3 5 8-6 8-9 7-12 5-16 4 1 9 10 8 15 4 13v9l-8 11-11 8-12 5-4 1h-15l-6-3-7-6-2-4 2 10 7 11 7 6 9 5 16 6 6 1-2 4-12 10-15 7-7 2h-9l-10-5-8-7-7-12-3-11v-15l4-10 4-6 3-4-10 8-9 10-9 15-8 20-4-2-9-10-8-16v-8l5-16 6-11 8-7 10-6 12-4h12l10 4 3 1-5-9-8-7-10-4-5-1H45l4-6 12-10 16-8 6-2Zm0 4-12 3-16 8-7 6v1l17 1 13 4 9 6 6 8 3 7v5l-4 1-9-6-4-1H74l-6 2-8 4-9 6-8 11-5 16-1 8 6 12 7 9h2l9-19 10-14 9-10 7-5 3-1h7l-1 5-7 6-4 8-2 6v13l4 14 7 9 6 5 8 4h8l14-5 10-7 4-4-21-9-8-6-7-7-5-10-2-8v-8l5-1 5 9 7 6 11 2 13-3 11-6 9-8 4-6v-8l-6-17-7-10-5-5-5 12-6 10-8 10-10 8-5 1-1-5 6-13 1-4V59l-4-10-6-9-8-7Z"/>
            <path fill="#060606" d="M89 15h22l17 4 14 6 10 7 10 9 9 11 6 11 4 9 3 14 1 9v9l-3 19-5 14-8 13-11 12-9 8-17 9-21 5H89l-18-4-16-8-6-4-10-9-9-10-6-10-6-16-2-9-1-17 2-16 4-14 5-10 6-9 9-10 9-8 16-9 18-5Zm4 3-16 3-16 7-11 7-11 10-8 11-8 16-3 12-1 7v17l2 12 5 14 6 11 9 11 10 9 15 9 14 5 11 2h18l13-3 14-5 14-9 12-11 9-13 7-16 2-7 1-9V90l-3-15-7-16-8-11-8-9-12-9-17-8-12-3-7-1Z"/>
        </svg>
    </div>

    <div class="page">
        <div class="container">
            <div class="previewsection">
                <div class="textdisplay">
                    <div class="textshadow"></div>
                    <div class="textpreview"></div>
                    <div class="cursoroverlay"></div>
                    <div class="selectionoverlay"></div>
                    <textarea class="textinput" placeholder="Input here..."></textarea>
                </div>
            </div>

            <div class="configs">
                <div class="draghandle"></div>
                <div class="configlines">
                    <div class="configline">
                        <button class="fontbutton active clickable" data-font="Good Dog">
                            <img src="/levels/assets/images/buttons/sbutton.webp" draggable="false">
                            <span>GoodDog</span>
                        </button>
                        <button class="fontbutton clickable" data-font="Good Dog Cool">
                            <img src="/levels/assets/images/buttons/sbutton.webp" draggable="false">
                            <span>Cool</span>
                        </button>
                        <button class="fontbutton clickable" data-font="Good Dog Bones">
                            <img src="/levels/assets/images/buttons/sbutton.webp" draggable="false">
                            <span>Bones</span>
                        </button>
                        <button class="fontbutton clickable" data-font="Good Dog New">
                            <img src="/levels/assets/images/buttons/sbutton.webp" draggable="false">
                            <span>New</span>
                        </button>
                    </div>

                    <div class="configline">
                        <button class="preset clickable" data-preset="default">
                            <img src="/levels/assets/images/buttons/sbutton.webp" draggable="false">
                            <span>Default</span>
                        </button>
                        <button class="preset clickable" data-preset="plain">
                            <img src="/levels/assets/images/buttons/sbutton.webp" draggable="false">
                            <span>Plain</span>
                        </button>
                        <button class="preset clickable" data-preset="cyan">
                            <img src="/levels/assets/images/buttons/sbutton.webp" draggable="false">
                            <span>Cyan</span>
                        </button>
                    </div>

                    <div class="configline numberline">
                        <div class="settinggroup">
                            <label class="settinglabel">Kerning</label>
                            <input type="number" class="settinginput numberinput kerning" value="0" step="0.1">
                        </div>
                        <div class="settinggroup">
                            <label class="settinglabel">Outline Size</label>
                            <input type="number" class="settinginput numberinput outlinesize" value="4" min="0" max="20" step="0.5">
                        </div>
                        <div class="settinggroup">
                            <label class="settinglabel">Shadow X</label>
                            <input type="number" class="settinginput numberinput shadowx" value="0" step="0.5">
                        </div>
                        <div class="settinggroup">
                            <label class="settinglabel">Shadow Y</label>
                            <input type="number" class="settinginput numberinput shadowy" value="4" step="0.5">
                        </div>
                    </div>

                    <div class="configline colorline">
                        <div class="settinggroup">
                            <label class="settinglabel">Font Color</label>
                            <div class="colorgroup">
                                <input type="color" class="settinginput colorpicker fontcolorpicker" value="#ffffff">
                                <input type="text" class="settinginput colorinput fontcolor" value="#ffffff" placeholder="#ffffff">
                            </div>
                            <div class="opacitycontrol">
                                <input type="range" class="opacityslider fontcoloropacity" min="0" max="100" value="100" step="1">
                                <input type="number" class="settinginput numberinput opacityvalue fontcoloropacityvalue" value="100" min="0" max="100" step="1">
                            </div>
                        </div>
                        <div class="settinggroup">
                            <label class="settinglabel">Outline Color</label>
                            <div class="colorgroup">
                                <input type="color" class="settinginput colorpicker outlinecolorpicker" value="#000000">
                                <input type="text" class="settinginput colorinput outlinecolor" value="#000000cc" placeholder="#000000cc">
                            </div>
                            <div class="opacitycontrol">
                                <input type="range" class="opacityslider outlinecoloropacity" min="0" max="100" value="80" step="1">
                                <input type="number" class="settinginput numberinput opacityvalue outlinecoloropacityvalue" value="80" min="0" max="100" step="1">
                            </div>
                        </div>
                        <div class="settinggroup">
                            <label class="settinglabel">Shadow Color</label>
                            <div class="colorgroup">
                                <input type="color" class="settinginput colorpicker shadowcolorpicker" value="#2b0f00">
                                <input type="text" class="settinginput colorinput shadowcolor" value="#2b0f00cc" placeholder="#2b0f00cc">
                            </div>
                            <div class="opacitycontrol">
                                <input type="range" class="opacityslider shadowcoloropacity" min="0" max="100" value="80" step="1">
                                <input type="number" class="settinginput numberinput opacityvalue shadowcoloropacityvalue" value="80" min="0" max="100" step="1">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="downloadsection">
                <div class="settinggroup">
                    <label class="settinglabel">Output Width</label>
                    <input type="number" class="settinginput imagesize" value="1000" min="100" max="5000" step="100">
                </div>
                <a class="sbutton clickable downloadbutton">
                    <img src="/levels/assets/images/buttons/sbutton.webp" draggable="false">
                    <span>Download</span>
                </a>
            </div>
        </div>
    </div>

    <script>

        // loading
        window.addEventListener("load", function() {
            var loading = document.querySelector(".loading");
            if (loading) {
                loading.style.opacity = "0";
                setTimeout(function() {
                    if (loading.parentNode) {loading.parentNode.removeChild(loading)}
                }, 500);
            }
        });

        // click sfx
        document.querySelectorAll(".clickable").forEach(function(element) {
            element.addEventListener("click", function() {
                document.querySelector(".click").currentTime = 0;
                document.querySelector(".click").play();
            });
        });

        /*//////////////////////////////////////////////////////////////////////*/

        // presets
        const presets = {
            default: {
                fontcolor: "#ffffff",
                outlinecolor: "#000000cc",
                outlinesize: 6,
                shadowcolor: "#2b0f00cc",
                shadowx: 0,
                shadowy: 4
            },
            plain: {
                fontcolor: "#000000cc",
                outlinecolor: "#00000000",
                outlinesize: 0,
                shadowcolor: "#00000000",
                shadowx: 0,
                shadowy: 0
            },
            cyan: {
                fontcolor: "#9faef1ff",
                outlinecolor: "#00000000",
                outlinesize: 0,
                shadowcolor: "#00000000",
                shadowx: 0,
                shadowy: 0
            }
        }

        // state
        const state = {
            text: "",
            font: "Good Dog",
            kerning: 0,
            imagesize: 1000,
            fontcolor: presets.default.fontcolor,
            outlinecolor: presets.default.outlinecolor,
            outlinesize: presets.default.outlinesize,
            shadowcolor: presets.default.shadowcolor,
            shadowx: presets.default.shadowx,
            shadowy: presets.default.shadowy
        }

        /*//////////////////////////////////////////////////////////////////////*/

        const textinput = document.querySelector(".textinput")
        const textpreview = document.querySelector(".textpreview")
        const fontbuttons = document.querySelectorAll(".fontbutton")
        const settinginputs = {
            kerning: document.querySelector(".kerning"),
            imagesize: document.querySelector(".imagesize"),
            fontcolor: document.querySelector(".fontcolor"),
            fontcolorpicker: document.querySelector(".fontcolorpicker"),
            fontcoloropacity: document.querySelector(".fontcoloropacity"),
            fontcoloropacityvalue: document.querySelector(".fontcoloropacityvalue"),
            outlinecolor: document.querySelector(".outlinecolor"),
            outlinecolorpicker: document.querySelector(".outlinecolorpicker"),
            outlinecoloropacity: document.querySelector(".outlinecoloropacity"),
            outlinecoloropacityvalue: document.querySelector(".outlinecoloropacityvalue"),
            outlinesize: document.querySelector(".outlinesize"),
            shadowcolor: document.querySelector(".shadowcolor"),
            shadowcolorpicker: document.querySelector(".shadowcolorpicker"),
            shadowcoloropacity: document.querySelector(".shadowcoloropacity"),
            shadowcoloropacityvalue: document.querySelector(".shadowcoloropacityvalue"),
            shadowx: document.querySelector(".shadowx"),
            shadowy: document.querySelector(".shadowy")
        }

        function hextoopacity(hex) {
            if (!hex || typeof hex !== "string" || hex.length < 7) return 100
            if (hex.length === 9) {
                const alpha = parseInt(hex.slice(7, 9), 16)
                if (isNaN(alpha)) return 100
                return Math.round(alpha / 255 * 100)
            }
            return 100
        }
        function opacitytohexalpha(opacity) {
            const alpha = Math.round((opacity / 100) * 255)
            return alpha.toString(16).padStart(2, "0")
        }
        function updatecolorwithopacity(colorhex, opacity) {
            const rgbhex = hexrgbatohexrgb(colorhex)
            return rgbhex + opacitytohexalpha(opacity)
        }

        fontbuttons.forEach(btn => {
            btn.addEventListener("click", function() {
                fontbuttons.forEach(b => b.classList.remove("active"))
                this.classList.add("active")
                state.font = this.dataset.font
                updatepreview()
            })
        })
        fontbuttons.forEach(btn => {
            if (!btn.querySelector("img")) {
                const img = document.createElement("img")
                img.src = "/levels/assets/images/buttons/sbutton.webp"
                img.draggable = false
                btn.insertBefore(img, btn.firstChild)
                const span = document.createElement("span")
                span.textContent = btn.textContent.trim()
                btn.appendChild(span)
                btn.textContent = ""
            }
        })

        Object.keys(settinginputs).forEach(k => {
            if (!settinginputs[k]) return

            if (k === "fontcolor" || k === "outlinecolor" || k === "shadowcolor" || k === "fontcolorpicker" || k === "outlinecolorpicker" || k === "shadowcolorpicker") {
                const basekey = k.replace("picker", "")
                const ispicker = k.endsWith("picker")
                settinginputs[k].addEventListener("input", function() {
                    let v = this.value.trim()
                    if (v.startsWith("#")) {
                        v = v.slice(1)
                    }
                    v = v.slice(0, 8)
                    v = "#" + v

                    if (ispicker) {
                        const rgbhex = v
                        const opacityinput = settinginputs[basekey + "opacity"]
                        let opacity = opacityinput ? parseFloat(opacityinput.value) : 100
                        if (isNaN(opacity)) {
                            opacity = hextoopacity(state[basekey] || "#000000ff")
                        }
                        const newv = updatecolorwithopacity(rgbhex, opacity)
                        state[basekey] = newv
                        settinginputs[basekey].value = newv
                        if (opacityinput) {
                            settinginputs[basekey + "opacityvalue"].value = opacity
                        }
                    } else {
                        if (/^#[0-9a-fA-F]{6}$/.test(v)) {
                            const opacityinput = settinginputs[basekey + "opacity"]
                            let opacity = opacityinput ? parseFloat(opacityinput.value) : 100
                            if (isNaN(opacity)) {
                                opacity = hextoopacity(state[basekey] || "#000000ff")
                            }
                            v = updatecolorwithopacity(v, opacity)
                            state[basekey] = v
                            settinginputs[basekey + "picker"].value = hexrgbatohexrgb(v)
                        } else if (/^#[0-9a-fA-F]{8}$/.test(v)) {
                            state[basekey] = v
                            settinginputs[basekey + "picker"].value = hexrgbatohexrgb(v)
                            const opacity = hextoopacity(v)
                            if (settinginputs[basekey + "opacity"]) {
                                settinginputs[basekey + "opacity"].value = opacity
                                settinginputs[basekey + "opacityvalue"].value = opacity
                            }
                        } else {state[basekey] = v}
                    } updatepreview()
                })
            } else if (k.endsWith("opacity") || k.endsWith("opacityvalue")) {
                const basekey = k.replace("opacity", "").replace("value", "")
                const isvalue = k.endsWith("value")
                const otherkey = isvalue ? basekey + "opacity" : basekey + "opacityvalue"

                settinginputs[k].addEventListener("input", function() {
                    let opacity = parseFloat(this.value)
                    if (isNaN(opacity)) {
                        const currentopacity = hextoopacity(state[basekey] || "#000000ff")
                        opacity = currentopacity
                        this.value = opacity
                    }
                    opacity = Math.max(0, Math.min(100, opacity))
                    if (settinginputs[otherkey]) {
                        settinginputs[otherkey].value = opacity
                    }
                    const currentcolor = state[basekey] || "#000000"
                    const newcolor = updatecolorwithopacity(currentcolor, opacity)
                    state[basekey] = newcolor
                    settinginputs[basekey].value = newcolor
                    updatepreview()
                })
            } else {
                settinginputs[k].addEventListener("input", function() {
                    state[k] = parseFloat(this.value) || 0
                    updatepreview()
                })
            }
        })

        textinput.addEventListener("input", function() {
            state.text = this.value
            updatepreview()
        })
        textinput.addEventListener("focus", function() { updatepreview() })
        textinput.addEventListener("blur", function() { updatepreview() })

        /*//////////////////////////////////////////////////////////////////////*/

        // cursor stufff
        let cursorupdateinterval = null
        function startcursorupdate() {
            if (cursorupdateinterval) return
            cursorupdateinterval = setInterval(function() {
                if (document.activeElement === textinput) {
                    updatepreview()
                } else {
                    clearInterval(cursorupdateinterval)
                    cursorupdateinterval = null
                }
            }, 100)
        }
        textinput.addEventListener("focus", startcursorupdate)
        textinput.addEventListener("blur", function() {
            if (cursorupdateinterval) {
                clearInterval(cursorupdateinterval)
                cursorupdateinterval = null
            }
            updatepreview()
        })
        document.addEventListener("selectionchange", function() {
            if (document.activeElement === textinput) {
                updatepreview()
            }
        })

        /*//////////////////////////////////////////////////////////////////////*/

        function applypresetstyling(e, p) {
            if (!p || !e) return
            e.style.color = p.fontcolor
            if (p.outlinesize > 0) {
                const outrgba = hextorgba(p.outlinecolor)
                e.style.webkitTextStroke = `${p.outlinesize}px ${outrgba}`
                e.style.textStroke = `${p.outlinesize}px ${outrgba}`
            } else {
                e.style.webkitTextStroke = "none"
                e.style.textStroke = "none"
            }
            if (p.shadowx !== 0 || p.shadowy !== 0) {
                const shadrgba = hextorgba(p.shadowcolor)
                e.style.textShadow = `${p.shadowx}px ${p.shadowy}px 0 ${shadrgba}`
            } else {
                e.style.textShadow = "none"
            }
        }
        document.querySelectorAll(".preset").forEach(btn => {
            const pname = btn.dataset.preset
            const p = presets[pname]
            btn.addEventListener("click", function() {
                if (p) {
                    Object.assign(state, p)
                    settinginputs.fontcolor.value = state.fontcolor
                    settinginputs.fontcolorpicker.value = hexrgbatohexrgb(state.fontcolor)
                    const fontopacity = hextoopacity(state.fontcolor)
                    if (settinginputs.fontcoloropacity) {
                        settinginputs.fontcoloropacity.value = fontopacity
                        settinginputs.fontcoloropacityvalue.value = fontopacity
                    }
                    settinginputs.outlinecolor.value = state.outlinecolor
                    settinginputs.outlinecolorpicker.value = hexrgbatohexrgb(state.outlinecolor)
                    const outlineopacity = hextoopacity(state.outlinecolor)
                    if (settinginputs.outlinecoloropacity) {
                        settinginputs.outlinecoloropacity.value = outlineopacity
                        settinginputs.outlinecoloropacityvalue.value = outlineopacity
                    }
                    settinginputs.outlinesize.value = state.outlinesize
                    settinginputs.shadowcolor.value = state.shadowcolor
                    settinginputs.shadowcolorpicker.value = hexrgbatohexrgb(state.shadowcolor)
                    const shadowopacity = hextoopacity(state.shadowcolor)
                    if (settinginputs.shadowcoloropacity) {
                        settinginputs.shadowcoloropacity.value = shadowopacity
                        settinginputs.shadowcoloropacityvalue.value = shadowopacity
                    }
                    settinginputs.shadowx.value = state.shadowx
                    settinginputs.shadowy.value = state.shadowy
                    updatepreview()
                }
            })
        })

        function hextorgba(h) {
            if (!h || typeof h !== "string" || h.length < 7) return "rgba(0,0,0,1)"
            const r = parseInt(h.slice(1, 3), 16) || 0
            const g = parseInt(h.slice(3, 5), 16) || 0
            const b = parseInt(h.slice(5, 7), 16) || 0
            let a = 1
            if (h.length >= 9) {
                const alpha = parseInt(h.slice(7, 9), 16)
                a = isNaN(alpha) ? 1 : alpha / 255
            }
            return `rgba(${r},${g},${b},${a})`
        }
        function hexrgbatohexrgb(h) {
            if (!h || typeof h !== "string" || h.length < 7) return "#000000"
            return h.slice(0, 7)
        }

        function updatepreview() {
            const displaytext = state.text || ""
            const isplaceholder = !state.text
            const isfocused = document.activeElement === textinput
            let cursorpos = 0
            let selectionstart = 0
            let selectionend = 0
            if (isfocused && !isplaceholder) {
                cursorpos = textinput.selectionStart || 0
                selectionstart = textinput.selectionStart || 0
                selectionend = textinput.selectionEnd || 0
            }
            textpreview.textContent = displaytext || "Input here..."

            textpreview.style.fontFamily = state.font
            textpreview.style.color = isplaceholder ? "rgba(255,255,255,0.5)" : hextorgba(state.fontcolor)
            textpreview.style.letterSpacing = state.kerning + "px"
            textpreview.style.whiteSpace = "pre"
            textpreview.style.textAlign = "center"
            textpreview.style.lineHeight = "1.2"

            textinput.style.fontFamily = state.font
            textinput.style.letterSpacing = state.kerning + "px"
            autoresize()

            const computedfontsize = parseFloat(getComputedStyle(textpreview).fontSize)
            const scalefactor = computedfontsize / 68

            textinput.style.fontSize = computedfontsize + "px"

            if (state.outlinesize > 0 && !isplaceholder) {
                const outrgba = hextorgba(state.outlinecolor)
                const scaledoutlinesize = state.outlinesize * scalefactor
                textpreview.style.webkitTextStroke = `${scaledoutlinesize}px ${outrgba}`
                textpreview.style.textStroke = `${scaledoutlinesize}px ${outrgba}`
                textpreview.style.paintOrder = "stroke fill"
                const fontopacity = hextoopacity(state.fontcolor)
                if (fontopacity === 0 || fontopacity < 10) {
                    textpreview.style.webkitTextFillColor = outrgba
                    textpreview.style.textFillColor = outrgba
                } else {
                    textpreview.style.webkitTextFillColor = hextorgba(state.fontcolor)
                    textpreview.style.textFillColor = hextorgba(state.fontcolor)
                }
            } else {
                textpreview.style.webkitTextStroke = "0px transparent"
                textpreview.style.textStroke = "0px transparent"
                textpreview.style.paintOrder = "normal"
                textpreview.style.webkitTextFillColor = ""
                textpreview.style.textFillColor = ""
            }
            textpreview.style.textShadow = "none"
            updatecursoroverlay(cursorpos, isfocused, isplaceholder, computedfontsize)
            if (isfocused && !isplaceholder && selectionstart !== selectionend) {
                updateselectionoverlay(selectionstart, selectionend, computedfontsize)
            } else {
                const selectionoverlay = document.querySelector(".selectionoverlay")
                selectionoverlay.innerHTML = ""
            }
            const textshadow = document.querySelector(".textshadow")
            if ((state.shadowx !== 0 || state.shadowy !== 0) && !isplaceholder) {
                textshadow.style.display = "block"
                textshadow.textContent = displaytext
                textshadow.style.fontFamily = state.font
                textshadow.style.fontSize = computedfontsize + "px"
                textshadow.style.letterSpacing = state.kerning + "px"
                textshadow.style.whiteSpace = "pre"
                textshadow.style.textAlign = "center"
                textshadow.style.lineHeight = "1.2"
                const shadrgba = hextorgba(state.shadowcolor)
                const shadowhex = state.shadowcolor
                let shadowopacity = 1
                if (shadowhex.length === 9) {
                    shadowopacity = parseInt(shadowhex.slice(7, 9), 16) / 255
                }
                const shadowrgb = hexrgbatohexrgb(shadowhex)
                const rgbmatch = shadowrgb.match(/#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})/i)
                const shadowrgbonly = rgbmatch
                    ? `rgb(${parseInt(rgbmatch[1], 16)}, ${parseInt(rgbmatch[2], 16)}, ${parseInt(rgbmatch[3], 16)})`
                    : shadrgba
                textshadow.style.opacity = shadowopacity.toString()
                textshadow.style.color = shadowrgbonly
                textshadow.style.textShadow = "none"
                if (state.outlinesize > 0) {
                    const scaledoutlinesize = state.outlinesize * scalefactor
                    textshadow.style.webkitTextStroke = `${scaledoutlinesize}px ${shadowrgbonly}`
                    textshadow.style.textStroke = `${scaledoutlinesize}px ${shadowrgbonly}`
                    textshadow.style.webkitTextFillColor = shadowrgbonly
                    textshadow.style.textFillColor = shadowrgbonly
                } else {
                    textshadow.style.webkitTextStroke = "0px transparent"
                    textshadow.style.textStroke = "0px transparent"
                }
                const scaledshadowx = state.shadowx * scalefactor
                const scaledshadowy = state.shadowy * scalefactor
                textshadow.style.transform = `translate(calc(-50% + ${scaledshadowx}px), calc(-50% + ${scaledshadowy}px))`
            } else {
                textshadow.style.display = "none"
            }
        }
        function escapehtml(t) {
            const d = document.createElement("div")
            d.textContent = t
            return d.innerHTML
        }

        /*//////////////////////////////////////////////////////////////////////*/

        // cursor + selection overlay
        function updatecursoroverlay(cpos, isfoc, isph, fontsize) {
            const cursoroverlay = document.querySelector(".cursoroverlay")
            cursoroverlay.innerHTML = ""
            if (!isfoc) return
            const displaytext = state.text || ""
            const textbeforecursor = displaytext.slice(0, cpos)
            const alllines = displaytext.split('\n')
            const lines = textbeforecursor.split('\n')
            const currlineidx = lines.length - 1
            const lastline = lines[currlineidx]
            const lineheight = fontsize * 1.2
            const measurespan = document.createElement("span")
            measurespan.style.position = "absolute"
            measurespan.style.visibility = "hidden"
            measurespan.style.whiteSpace = "pre"
            measurespan.style.fontFamily = state.font
            measurespan.style.fontSize = fontsize + "px"
            measurespan.style.letterSpacing = state.kerning + "px"
            measurespan.style.lineHeight = "1.2"
            const fullcurrline = alllines[currlineidx]
            measurespan.textContent = fullcurrline
            document.body.appendChild(measurespan)
            const currlinewidth = measurespan.offsetWidth
            measurespan.textContent = lastline
            const textbeforecursorwidth = measurespan.offsetWidth
            measurespan.remove()
            const cursorx = textbeforecursorwidth - (currlinewidth / 2)
            const totalheight = alllines.length * lineheight
            const cursory = currlineidx * lineheight - (totalheight / 2)
            const cursorline = document.createElement("div")
            cursorline.className = "cursorline"
            cursorline.style.left = cursorx + "px"
            cursorline.style.top = cursory + "px"
            cursorline.style.height = fontsize + "px"
            cursoroverlay.appendChild(cursorline)
        }

        function updateselectionoverlay(selectionstart, selectionend, fontsize) {
            const selectionoverlay = document.querySelector(".selectionoverlay")
            selectionoverlay.innerHTML = ""
            const displaytext = state.text || ""
            if (!displaytext || selectionstart === selectionend) return
            const lines = displaytext.split('\n')
            const lineheight = fontsize * 1.2
            const totalheight = lines.length * lineheight
            const measurespan = document.createElement("span")
            measurespan.style.position = "absolute"
            measurespan.style.visibility = "hidden"
            measurespan.style.whiteSpace = "pre"
            measurespan.style.fontFamily = state.font
            measurespan.style.fontSize = fontsize + "px"
            measurespan.style.letterSpacing = state.kerning + "px"
            measurespan.style.lineHeight = "1.2"
            let charidx = 0
            for (let lineidx = 0; lineidx < lines.length; lineidx++) {
                const line = lines[lineidx]
                const linestart = charidx
                const lineend = charidx + line.length
                if (selectionend > linestart && selectionstart < lineend) {
                    const sstartinline = Math.max(0, selectionstart - linestart)
                    const sendinline = Math.min(line.length, selectionend - linestart)
                    const beforetext = line.slice(0, sstartinline)
                    const selectedinline = line.slice(sstartinline, sendinline)
                    measurespan.textContent = line
                    document.body.appendChild(measurespan)
                    const currlinewidth = measurespan.offsetWidth
                    measurespan.textContent = beforetext
                    const beforewidth = measurespan.offsetWidth
                    measurespan.textContent = selectedinline
                    const selectedwidth = measurespan.offsetWidth
                    measurespan.remove()
                    const selectionx = beforewidth - (currlinewidth / 2)
                    const selectiony = lineidx * lineheight - (totalheight / 2)
                    const selectionwidth = selectedwidth
                    const selectionbox = document.createElement("div")
                    selectionbox.className = "selectionbox"
                    selectionbox.style.left = selectionx + "px"
                    selectionbox.style.top = selectiony + "px"
                    selectionbox.style.width = selectionwidth + "px"
                    selectionbox.style.height = fontsize + "px"
                    selectionoverlay.appendChild(selectionbox)
                }
                charidx = lineend + 1
            }
        }

        /*//////////////////////////////////////////////////////////////////////*/

        function autoresize() {
            const maxwidth = window.innerWidth * 0.9
            const maxheight = window.innerHeight * 0.9
            let min = 8
            let max = 200
            let best = 68
            textpreview.style.whiteSpace = "pre"
            while (min <= max) {
                const fontsize = Math.floor((min + max) / 2)
                textpreview.style.fontSize = fontsize + "px"
                void textpreview.offsetHeight
                const width = textpreview.scrollWidth
                const height = textpreview.scrollHeight
                if (width <= maxwidth && height <= maxheight) {
                    best = fontsize
                    min = fontsize + 1
                } else {
                    max = fontsize - 1
                }
            }
            textpreview.style.fontSize = best + "px"
            textpreview.style.whiteSpace = "pre"
            void textpreview.offsetHeight
        }

        document.querySelector(".downloadbutton").addEventListener("click", async function() {
            if (!state.text) return
            const p_el = document.querySelector(".textpreview")
            const s_el = document.querySelector(".textshadow")
            const getActualBounds = (el) => {
                const range = document.createRange()
                range.selectNodeContents(el)
                return range.getBoundingClientRect()
            }
            const p_rect = getActualBounds(p_el)
            const s_rect = s_el.style.display !== "none" ? getActualBounds(s_el) : p_rect
            const minx = Math.min(p_rect.left, s_rect.left)
            const miny = Math.min(p_rect.top, s_rect.top)
            const maxx = Math.max(p_rect.right, s_rect.right)
            const maxy = Math.max(p_rect.bottom, s_rect.bottom)
            const f_sz = parseFloat(getComputedStyle(p_el).fontSize)
            const scale = f_sz / 68
            const pad = Math.max(60, (state.outlinesize * scale) + 20)
            const w = (maxx - minx) + (pad * 2)
            const h = (maxy - miny) + (pad * 2)
            const container = document.createElement("div")
            container.style.cssText = `position:fixed;left:-9999px;top:0;width:${w}px;height:${h}px;background:transparent;z-index:-1;`
            document.body.appendChild(container)
            const clone = document.createElement("div")
            clone.style.cssText = `position:relative;width:${w}px;height:${h}px;display:flex;justify-content:center;align-items:center;`
            const copyStyle = (src, dest, extra = {}) => {
                const s = getComputedStyle(src); dest.style.fontFamily = s.fontFamily;
                dest.style.fontSize = s.fontSize; dest.style.color = s.color;
                dest.style.letterSpacing = s.letterSpacing; dest.style.lineHeight = s.lineHeight;
                dest.style.whiteSpace = "pre"; dest.style.textAlign = "center";
                dest.style.webkitTextStroke = s.webkitTextStroke; dest.style.textStroke = s.textStroke;
                dest.style.webkitTextFillColor = s.webkitTextFillColor; dest.style.paintOrder = s.paintOrder;
                dest.style.textShadow = s.textShadow; Object.assign(dest.style, extra);
            }
            const c_p = document.createElement("div")
            c_p.textContent = state.text
            copyStyle(p_el, c_p, { position: "absolute", left: "50%", top: "50%", transform: "translate(-50%, -50%)", zIndex: "2" })
            clone.appendChild(c_p)
            if (s_el.style.display !== "none") {
                const c_s = document.createElement("div")
                c_s.textContent = state.text
                const ox = state.shadowx * scale, oy = state.shadowy * scale;
                copyStyle(s_el, c_s, {
                    position: "absolute", left: "50%", top: "50%",
                    transform: `translate(calc(-50% + ${ox}px), calc(-50% + ${oy}px))`,
                    zIndex: "1"
                })
                const shadowhex = state.shadowcolor
                let shadowopacity = 1
                if (shadowhex.length === 9) {
                    shadowopacity = parseInt(shadowhex.slice(7, 9), 16) / 255
                }
                const shadowrgb = hexrgbatohexrgb(shadowhex)
                const rgbmatch = shadowrgb.match(/#([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})/i)
                const shadowrgbonly = rgbmatch
                    ? `rgb(${parseInt(rgbmatch[1], 16)}, ${parseInt(rgbmatch[2], 16)}, ${parseInt(rgbmatch[3], 16)})`
                    : hextorgba(shadowhex)
                c_s.style.opacity = shadowopacity.toString()
                c_s.style.color = shadowrgbonly
                if (state.outlinesize > 0) {
                    const scaledoutlinesize = state.outlinesize * scale
                    c_s.style.webkitTextStroke = `${scaledoutlinesize}px ${shadowrgbonly}`
                    c_s.style.textStroke = `${scaledoutlinesize}px ${shadowrgbonly}`
                    c_s.style.webkitTextFillColor = shadowrgbonly
                    c_s.style.textFillColor = shadowrgbonly
                    c_s.style.paintOrder = "stroke fill"
                } else {
                    c_s.style.webkitTextStroke = "0px transparent"
                    c_s.style.textStroke = "0px transparent"
                }
                clone.appendChild(c_s)
            }
            container.appendChild(clone); await document.fonts.ready
            try {
                const canvas = await html2canvas(clone, {
                    backgroundColor: null, scale: 2, useCORS: true, logging: false, width: w, height: h
                })
                let final = canvas
                if (state.imagesize && state.imagesize !== canvas.width) {
                    const scaled = document.createElement("canvas")
                    scaled.width = state.imagesize; scaled.height = canvas.height * (state.imagesize / canvas.width)
                    const ctx = scaled.getContext("2d"); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
                    ctx.drawImage(canvas, 0, 0, canvas.width, canvas.height, 0, 0, scaled.width, scaled.height)
                    final = scaled
                }
                final.toBlob(blob => {
                    const url = URL.createObjectURL(blob); const a = document.createElement("a");
                    const words = state.text.trim().split(/\s+/).filter(w => w.length > 0)
                    const firstfive = words.slice(0, 5)
                    const filename = (words.length > 5 ? firstfive.join(" ") + "..." : firstfive.join(" ")) || "text"
                    const sanitized = filename.replace(/[<>:"/\\|?*]/g, "").trim() || "text"
                    a.href = url; a.download = `${sanitized}.png`; a.click();
                    URL.revokeObjectURL(url); container.remove()
                }, "image/png")
            } catch (e) {
                console.error(e); container.remove()
            }
        })

        /*//////////////////////////////////////////////////////////////////////*/

        const configs = document.querySelector(".configs")
        const draghandle = document.querySelector(".configs .draghandle")
        let isdragging = false
        let dragstartx = 0; let dragstarty = 0
        let configstartx = 0
        let configstarty = 0
        function mobilemode() {return window.innerWidth < 700}
        function resetconfigpos() {
            if (mobilemode() && configs) {
                configs.style.left = "auto"
                configs.style.right = "auto"
                configs.style.bottom = "0"
                configs.style.top = "auto"
                configs.style.transform = "none"
            }
        }
        if (draghandle && configs) {
            draghandle.addEventListener("mousedown", function(e) {
                if (mobilemode()) {e.preventDefault(); return}
                isdragging = true
                dragstartx = e.clientX
                dragstarty = e.clientY
                const rect = configs.getBoundingClientRect()
                configstartx = rect.left
                configstarty = rect.top
                e.preventDefault()
            })
            document.addEventListener("mousemove", function(e) {
                if (isdragging && !mobilemode()) {
                    const deltax = e.clientX - dragstartx
                    const deltay = e.clientY - dragstarty
                    configs.style.left = (configstartx + deltax) + "px"
                    configs.style.top = (configstarty + deltay) + "px"
                    configs.style.right = "auto"
                    configs.style.bottom = "auto"
                    configs.style.transform = "none"
                } else if (isdragging && mobilemode()) {
                    isdragging = false
                    resetconfigpos()
                }
            })
            document.addEventListener("mouseup", function() {
                if (isdragging && mobilemode()) {resetconfigpos()}
                isdragging = false
            })
            window.addEventListener("resize", function() {
                if (mobilemode()) {
                    resetconfigpos()
                    if (isdragging) {isdragging = false}
                }
            })
        }

        settinginputs.fontcolorpicker.value = hexrgbatohexrgb(state.fontcolor)
        settinginputs.outlinecolorpicker.value = hexrgbatohexrgb(state.outlinecolor)
        settinginputs.shadowcolorpicker.value = hexrgbatohexrgb(state.shadowcolor)

        if (settinginputs.fontcoloropacity) {
            const fontopacity = hextoopacity(state.fontcolor)
            settinginputs.fontcoloropacity.value = fontopacity
            settinginputs.fontcoloropacityvalue.value = fontopacity
        }
        if (settinginputs.outlinecoloropacity) {
            const outlineopacity = hextoopacity(state.outlinecolor)
            settinginputs.outlinecoloropacity.value = outlineopacity
            settinginputs.outlinecoloropacityvalue.value = outlineopacity
        }
        if (settinginputs.shadowcoloropacity) {
            const shadowopacity = hextoopacity(state.shadowcolor)
            settinginputs.shadowcoloropacity.value = shadowopacity
            settinginputs.shadowcoloropacityvalue.value = shadowopacity
        }

        updatepreview()
        window.addEventListener("resize", function() {
            setTimeout(updatepreview, 100)
        })

    </script>
</body>
</html>
