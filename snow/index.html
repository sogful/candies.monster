        if (/complete|interactive/.test(document.readyState)) {letitsnow()}
        else if (document.addEventListener) {
            document.addEventListener("DOMContentLoaded", letitsnow);
        } else {
            document.attachEvent("onreadystatechange", function () {
                if (/complete|interactive/.test(document.readyState)) {letitsnow()}
            });
        }
    })();
    </script>

    <script>
        
        // animated favicon
        (function() {
            let spritejson = null; let sheetloaded = false;
            let favicons = []; let index = 0; const delay = 300;
            let sheetimg = null;

            fetch("/assets/images/icon.json")
                .then(response => response.json()).then(data => {
                    spritejson = data.frames; sheetimg = new Image();
                    sheetimg.onload = () => {
                        sheetloaded = true;
                        const canvas = document.createElement("canvas");
                        const ctx = canvas.getContext("2d");
                        favicons = spritejson.map(frame => {
                            canvas.width = frame.frame.w;
                            canvas.height = frame.frame.h;
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            ctx.drawImage(
                                sheetimg,
                                frame.frame.x, frame.frame.y, frame.frame.w, frame.frame.h,
                                0, 0, frame.frame.w, frame.frame.h
                            ); return canvas.toDataURL("image/png");
                        }); favicongif();
                    }; sheetimg.src = "/assets/images/icon.webp";
                });
            function favicongif() {
                if (!sheetloaded || favicons.length === 0) {setTimeout(favicongif, 50); return;}
                const link = document.querySelector("link[rel='icon']") || document.createElement("link");
                link.rel = "icon"; link.href = favicons[index];
                document.head.appendChild(link);
                index = (index + 1) % favicons.length;
                setTimeout(favicongif, delay);
            }
        })();

        // loading
        window.addEventListener("load", function() {
            var loading = document.querySelector(".loading");
            if (loading) {
                loading.style.opacity = "0";
                setTimeout(function() {
                    if (loading.parentNode) {loading.parentNode.removeChild(loading)}
                }, 500);
            }
        });

        // click sfx
        document.querySelectorAll(".clickable").forEach(function(element) {
            element.addEventListener("click", function() {
                document.querySelector(".click").currentTime = 0;
                document.querySelector(".click").play();
            });
        });

        /*//////////////////////////////////////////////////////////////////////*/

        (function copysnow() {
            var copyButton = document.querySelector(".sbutton");
            var copiedBanner = document.querySelector(".copied");
            if (!copyButton) return;

            function findsnowcode() {
                var walker = document.createTreeWalker(document.body, NodeFilter.SHOW_COMMENT, null, false);
                var markers = [];
                while (walker.nextNode()) {
                    var value = (walker.currentNode.nodeValue || "").trim();
                    if (value === "//////////////////////////////////////////////////////") {
                        markers.push(walker.currentNode);
                        if (markers.length === 2) break;
                    }
                }
                return markers.length === 2 ? markers : [null, null];
            }

            function serializeNodesBetween(start, end) {
                if (!start || !end) return "";
                var chunks = [];
                for (var node = start.nextSibling; node && node !== end; node = node.nextSibling) {
                    if (node.outerHTML !== undefined) {
                        chunks.push(node.outerHTML);
                    } else if (node.nodeType === Node.TEXT_NODE) {
                        chunks.push(node.textContent);
                    }
                }
                return chunks.join("\n").trim();
            }

            function showcopied(message) {
                if (!copiedBanner) return;
                var label = copiedBanner.querySelector("a") || copiedBanner;
                label.textContent = message;
                copiedBanner.style.opacity = "1";
                setTimeout(function () { copiedBanner.style.opacity = "0"; }, 1000);
            }

            function copytext(text) {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    return navigator.clipboard.writeText(text);
                }
                var textarea = document.createElement("textarea");
                textarea.value = text;
                textarea.style.position = "fixed";
                textarea.style.top = "-1000px";
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                var ok = false;
                try { ok = document.execCommand("copy"); } catch (_) { ok = false; }
                document.body.removeChild(textarea);
                return ok ? Promise.resolve() : Promise.reject();
            }

            copyButton.addEventListener("click", function () {
                document.querySelector(".snow").innerHTML = "";
                var markers = findsnowcode();
                var code = serializeNodesBetween(markers[0], markers[1]);
                if (!code) { showcopied("copy failed"); return; }
                copytext(code).then(function () {
                    showcopied("copied!");
                }).catch(function () {
                    showcopied("copy failed");
                });
            });
        })();
                
    </script>
