<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Package Editor – candies.monster</title>
    <link rel="canonical" href="https://candies.monster/edit/">
    <link rel="icon" href="/assets/images/candies/favicon.png">
    <meta property="og:image" content="https://candies.monster/assets/images/branding/embeds/edit.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://candies.monster/assets/images/branding/embeds/edit.png">

    <link rel="preload" href="/assets/fonts/gooddog.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/images/edit/explosion.gif" as="image">

    <link rel="stylesheet" href="/assets/static/css/back.css">
    <link rel="stylesheet" href="/assets/static/css/github.css">
    <link rel="stylesheet" href="/assets/static/css/drag.css">
    <link rel="stylesheet" href="/versions/src/css/search.css">
    <link rel="stylesheet" href="/assets/static/css/dropdown.css">
    <link rel="stylesheet" href="/src/css/browser/discord.css">

    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="src/header.css">
    <link rel="stylesheet" href="src/quickactions.css">
    <link rel="stylesheet" href="src/levelview.css">
    <link rel="stylesheet" href="src/levelpicker.css">
    <link rel="stylesheet" href="src/media.css">

    <script src="/assets/static/js/text/fonts.js"></script>
    <script defer src="/assets/static/js/back.js"></script>
    <script defer src="/assets/static/dependencies/jszip.min.js"></script>

    <script type="module" src="index.js"></script>

</head>
<body class="editorpage">
    <a class="pageback" href="/"><img src="/assets/images/buttons/back.png" alt="Back" width="42" height="42" draggable="false"></a>
    <a class="github intakegithub" href="https://github.com/sogful/candies.monster"><img src="/assets/images/github.png" alt="GitHub repository" draggable="false"></a>
    <div class="drag" aria-hidden="true">Drop here!</div>
    <audio class="click" src="/assets/audio/tap.mp3" preload="auto"></audio>
    <main class="page">
        <section class="workspace">
            <div class="intake">
                <h1 class="intaketitle">Package Editor</h1>
                <input class="packageinput" type="file" accept=".apk,.ipa,.xapk,.apks" multiple hidden>
                <button class="input uploadinput pick" type="button">
                    <span class="pickprompt">Click to open file explorer<br>or drag the file here...</span>
                    <span class="pickprogress" role="status" hidden></span>
                </button>
                <p class="intakenote">(This tool is a work in progress, sorry if things break!)</p>
            </div>

            <div class="editor" hidden>
                <header class="editorheader"></header>
                <p class="unitymessage" hidden>This is a Unity game, use <a href="https://github.com/assetripper/assetripper" target="_blank" rel="noopener">AssetRipper</a> to edit its contents!</p>

                <div class="editorbody">
                    <div class="editorcontent">
                        <nav class="editortabs">
                            <button class="buttonart tool" type="button" data-tool="levels" aria-pressed="false">Levels</button>
                            <button class="buttonart tool" type="button" data-tool="sprites" aria-pressed="false">Media</button>
                            <button class="buttonart tool" type="button" data-tool="strings" aria-pressed="false">Strings</button>
                            <button class="buttonart tool" type="button" data-tool="symbols" aria-pressed="false">Symbols</button>
                        </nav>
                        <section class="analysis" hidden>
                            <div class="resulttools">
                                <label class="controldropdown"><select class="filelist" title="Symbol source"></select></label>
                                <label class="controldropdown formatslabel" hidden><select class="reportformat" title="Symbol format"></select></label>
                                <div class="archivesearch editorsearch" role="search" hidden>
                                    <img src="/assets/images/icons/search.svg" alt="" width="20" height="20" draggable="false">
                                    <input class="archivequery filterresults" type="search" placeholder="Filter symbols" autocomplete="off" spellcheck="false">
                                    <button class="searchclear" type="button" hidden><img src="/assets/images/icons/x.svg" alt="Clear search" draggable="false"></button>
                                </div>
                            </div>
                            <p class="resultstatus"></p>
                            <div class="tablewrap" hidden>
                                <table class="resulttable">
                                    <thead><tr><th>Address</th><th>Type</th><th>Symbol</th></tr></thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                            <footer class="panelfooter">
                                <div class="pages" hidden>
                                    <button class="buttonart previous" type="button">Previous</button>
                                    <span class="pagetext"></span>
                                    <button class="buttonart next" type="button">Next</button>
                                </div>
                                <div class="panelactions">
                                    <button class="buttonart importreport" type="button">Import</button>
                                    <input class="reportinput" type="file" accept=".json,.tsv" hidden>
                                    <button class="buttonart downloadresults" type="button" disabled>Export</button>
                                </div>
                            </footer>
                        </section>
                        <section class="levelpanel" hidden>
                            <div class="levelpicker"></div>
                            <div class="levelview" hidden></div>
                            <footer class="panelfooter levelfooter" hidden>
                                <div class="panelactions">
                                    <a class="buttonart leveleditor" href="https://yell0wsuit.github.io/ctrdx-editor/" target="_blank" rel="noopener">DX Editor</a>
                                    <button class="buttonart importlevel" type="button">Import</button>
                                    <input class="levelinput" type="file" accept=".xml" hidden>
                                    <button class="buttonart exportlevel" type="button">Export</button>
                                </div>
                            </footer>
                        </section>
                        <section class="stringspanel" hidden>
                            <div class="resulttools">
                                <label class="controldropdown translationsource"><select class="stringselect" title="Translation group"></select></label>
                                <label class="controldropdown translationlanguage" hidden><select class="localeselect" title="Language"></select></label>
                                <div class="archivesearch editorsearch" role="search">
                                    <img src="/assets/images/icons/search.svg" alt="" width="20" height="20" draggable="false">
                                    <input class="archivequery filterstrings" type="search" placeholder="Find a string" autocomplete="off" spellcheck="false">
                                    <button class="searchclear" type="button" hidden><img src="/assets/images/icons/x.svg" alt="Clear search" draggable="false"></button>
                                </div>
                            </div>
                            <div class="tablewrap">
                                <table class="stringtable">
                                    <thead><tr><th>Key</th><th>Text</th></tr></thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                            <footer class="panelfooter">
                                <div class="pages" hidden>
                                    <button class="buttonart previous" type="button">Previous</button>
                                    <span class="pagetext"></span>
                                    <button class="buttonart next" type="button">Next</button>
                                </div>
                            </footer>
                        </section>
                        <section class="spritepanel" hidden>
                            <div class="resulttools">
                                <div class="archivesearch editorsearch" role="search">
                                    <img src="/assets/images/icons/search.svg" alt="" width="20" height="20" draggable="false">
                                    <input class="archivequery filtersprites" type="search" placeholder="Find files" autocomplete="off" spellcheck="false">
                                    <button class="searchclear" type="button" hidden><img src="/assets/images/icons/x.svg" alt="Clear search" draggable="false"></button>
                                </div>
                            </div>
                            <div class="spritedata">
                                <div class="spritebrowser">
                                    <div class="spritefiles"></div>
                                    <button class="buttonart extractpackagequads" type="button" hidden>Extract quads</button>
                                </div>
                                <div class="mediapreview">
                                    <div class="spriteview">
                                        <div class="texturestage" hidden>
                                            <img class="spriteimage" alt="" draggable="false">
                                            <div class="textureframes"></div>
                                        </div>
                                        <div class="spriteframeactions" hidden>
                                            <button class="buttonart importframe" type="button">Replace</button>
                                            <input class="spriteframeinput" type="file" accept="image/*" hidden>
                                            <button class="buttonart exportframe" type="button">Export</button>
                                        </div>
                                        <audio class="spriteaudio" preload="metadata" hidden></audio>
                                        <video class="spritevideo" preload="metadata" playsinline hidden></video>
                                    </div>
                                    <div class="mediacontrols" hidden>
                                        <button class="mediaplay clickable" type="button"><img src="/assets/images/icons/play.svg" alt="Play" draggable="false"></button>
                                        <span class="mediatime">0:00 / 0:00</span>
                                        <label class="mediaprogress">
                                            <span class="mediaprogressbody"></span>
                                            <span class="mediaprogressfill"></span>
                                            <input class="mediaseek" type="range" min="0" max="1000" value="0" title="Playback position">
                                        </label>
                                        <button class="rotatevideo clickable" type="button" hidden><img src="/assets/images/icons/loop.png" alt="Rotate video" draggable="false"></button>
                                        <button class="mediafullscreen clickable" type="button"><img src="/assets/images/icons/fullscreen.png" alt="Fullscreen" draggable="false"></button>
                                    </div>
                                    <button class="buttonart textureoutlines" type="button" aria-pressed="true" hidden>Toggle outlines</button>
                                    <p class="mediaplayerror" role="status" hidden></p>
                                </div>
                            </div>
                            <footer class="panelfooter">
                                <div class="panelactions">
                                    <button class="buttonart extracttexturequads" type="button" hidden>Extract quads</button>
                                    <button class="buttonart resetsprite" type="button" hidden>Reset</button>
                                    <button class="buttonart importsprite" type="button">Replace</button>
                                    <input class="spriteinput" type="file" accept="image/*" hidden>
                                    <button class="buttonart exportsprite" type="button">Export</button>
                                </div>
                            </footer>
                        </section>
                    </div>
                </div>
            </div>

            <p class="status" role="status"></p>
            <p class="error" role="alert" hidden></p>
        </section>
    </main>
</body>
</html>
