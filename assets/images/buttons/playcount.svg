<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 142 122">
    <defs>
        <filter id="outline" x="-10%" y="-10%" width="120%" height="120%">
            <feMorphology in="SourceAlpha" operator="dilate" radius="5" result="edge"/>
            <feFlood flood-color="#000"/>
            <feComposite in2="edge" operator="in"/>
            <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
    </defs>
    <image width="130" height="110" filter="url(#outline)" href="data:image/png;base64,"/>
</svg>
