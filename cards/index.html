    <a>Please enable Javascript in your browser to use this page.</a></div></noscript>

    <div class="page">
        <div class="carddisplay">
            <div class="cardcontainer">
                <button class="arrowbutton arrowleft clickable">
                    <img src="/levels/assets/images/controls/up.png">
                </button>
                <img class="card" src="assets/images/hq/card1.png">
                <img class="cardoverlay" src="assets/images/cardbase.png">
                <button class="arrowbutton arrowright clickable">
                    <img src="/levels/assets/images/controls/down.png">
                </button>
            </div>
            <div class="downloadbuttons">
                <button class="downloadbutton clickable" quality="lq">
                    <img src="assets/images/download.png">
                    <div class="extensionlabel">LQ</div>
                </button>
                <button class="downloadbutton clickable" quality="hq">

                    <img src="assets/images/download.png">
                    <div class="extensionlabel">HQ</div>
                </button>
            </div>
        </div>
        <a class="msg">Low quality versions come from CTR Origins, meanwhile high quality ones come from CTR.</a>
    </div>

    <script>
        
        // click sfx
        document.querySelectorAll(".clickable").forEach(function(element) {
            element.addEventListener("click", function() {
                document.querySelector(".click").currentTime = 0;
                document.querySelector(".click").play();
            });
        });

        /*//////////////////////////////////////////////////////////////////////*/

        let currentCardIndex = 1;
        const totalCards = 30;
        const cardImg = document.querySelector(".card");

        function updateCard() {
            cardImg.src = `assets/images/hq/card${currentCardIndex}.png`;
            cardImg.alt = `Card ${currentCardIndex}`;
        }

        document.querySelector(".arrowleft").addEventListener("click", function() {
            currentCardIndex = (currentCardIndex - 1 + totalCards) % totalCards || totalCards;
            updateCard();
        });

        document.querySelector(".arrowright").addEventListener("click", function() {
            currentCardIndex = (currentCardIndex % totalCards) + 1;
            updateCard();
        });

        document.querySelectorAll(".downloadbutton").forEach(function(button) {
            button.addEventListener("click", function() {
                const quality = this.getAttribute("quality");
                const downloadUrl = `assets/images/${quality}/card${currentCardIndex}.png`;
                
                const link = document.createElement("a");
                link.href = downloadUrl;
                link.download = `card${currentCardIndex}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        });

        /*//////////////////////////////////////////////////////////////////////*/

        let touchStartX = 0;
        let touchEndX = 0;

        cardImg.addEventListener("touchstart", function(e) {
            touchStartX = e.changedTouches[0].screenX;
        });

        cardImg.addEventListener("touchend", function(e) {
            touchEndX = e.changedTouches[0].screenX;
            if (touchEndX < touchStartX - 50) {
                currentCardIndex = (currentCardIndex % totalCards) + 1;
                updateCard();
            }
            if (touchEndX > touchStartX + 50) {
                currentCardIndex = (currentCardIndex - 1 + totalCards) % totalCards || totalCards;
                updateCard();
            }
        });

        document.addEventListener("keydown", function(e) {
            if (e.key === "ArrowLeft") {
                currentCardIndex = (currentCardIndex - 1 + totalCards) % totalCards || totalCards;
                updateCard();
            } else if (e.key === "ArrowRight") {
                currentCardIndex = (currentCardIndex % totalCards) + 1;
                updateCard();
            }
        });
                
    </script>
