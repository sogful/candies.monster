    <script>
        
        // animated favicon
        (function() {
            let spritejson = null; let sheetloaded = false;
            let favicons = []; let index = 0; const delay = 300;
            let sheetimg = null;

            fetch("/assets/images/icon.json")
                .then(response => response.json()).then(data => {
                    spritejson = data.frames; sheetimg = new Image();
                    sheetimg.onload = () => {
                        sheetloaded = true;
                        const canvas = document.createElement("canvas");
                        const ctx = canvas.getContext("2d");
                        favicons = spritejson.map(frame => {
                            canvas.width = frame.frame.w;
                            canvas.height = frame.frame.h;
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            ctx.drawImage(
                                sheetimg,
                                frame.frame.x, frame.frame.y, frame.frame.w, frame.frame.h,
                                0, 0, frame.frame.w, frame.frame.h
                            ); return canvas.toDataURL("image/png");
                        }); favicongif();
                    }; sheetimg.src = "/assets/images/icon.webp";
                });
            function favicongif() {
                if (!sheetloaded || favicons.length === 0) {setTimeout(favicongif, 50); return}
                const link = document.querySelector("link[rel='icon']") || document.createElement("link");
                link.rel = "icon"; link.href = favicons[index];
                document.head.appendChild(link);
                index = (index + 1) % favicons.length;
                setTimeout(favicongif, delay);
            }
        })();

        // loading
        window.addEventListener("load", function() {
            var loading = document.querySelector(".loading");
            if (loading) {
                loading.style.opacity = "0";
                setTimeout(function() {
                    if (loading.parentNode) {loading.parentNode.removeChild(loading)}
                }, 500);
            }
        });

        // click sfx
        document.querySelectorAll(".clickable").forEach(function(element) {
            element.addEventListener("click", function() {
                document.querySelector(".click").currentTime = 0;
                document.querySelector(".click").play();
            });
        });

        /*//////////////////////////////////////////////////////////////////////*/

        let currentCardIndex = 1;
        const totalCards = 30;
        const cardImg = document.querySelector(".card");

        function updateCard() {
            cardImg.src = `assets/images/hq/card${currentCardIndex}.png`;
            cardImg.alt = `Card ${currentCardIndex}`;
        }

        document.querySelector(".arrowleft").addEventListener("click", function() {
            currentCardIndex = (currentCardIndex - 1 + totalCards) % totalCards || totalCards;
            updateCard();
        });

        document.querySelector(".arrowright").addEventListener("click", function() {
            currentCardIndex = (currentCardIndex % totalCards) + 1;
            updateCard();
        });

        document.querySelectorAll(".downloadbutton").forEach(function(button) {
            button.addEventListener("click", function() {
                const quality = this.getAttribute("quality");
                const downloadUrl = `assets/images/${quality}/card${currentCardIndex}.png`;
                
                const link = document.createElement("a");
                link.href = downloadUrl;
                link.download = `card${currentCardIndex}.png`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            });
        });

        /*//////////////////////////////////////////////////////////////////////*/

        let touchStartX = 0;
        let touchEndX = 0;

        cardImg.addEventListener("touchstart", function(e) {
            touchStartX = e.changedTouches[0].screenX;
        });

        cardImg.addEventListener("touchend", function(e) {
            touchEndX = e.changedTouches[0].screenX;
            if (touchEndX < touchStartX - 50) {
                currentCardIndex = (currentCardIndex % totalCards) + 1;
                updateCard();
            }
            if (touchEndX > touchStartX + 50) {
                currentCardIndex = (currentCardIndex - 1 + totalCards) % totalCards || totalCards;
                updateCard();
            }
        });

        document.addEventListener("keydown", function(e) {
            if (e.key === "ArrowLeft") {
                currentCardIndex = (currentCardIndex - 1 + totalCards) % totalCards || totalCards;
                updateCard();
            } else if (e.key === "ArrowRight") {
                currentCardIndex = (currentCardIndex % totalCards) + 1;
                updateCard();
            }
        });
                
    </script>
