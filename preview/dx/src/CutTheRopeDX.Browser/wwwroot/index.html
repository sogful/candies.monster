<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <title>Cut the Rope: DX - Web Edition</title>
        <link rel="icon" type="image/x-icon" href="./favicon.ico" />
        <link rel="apple-touch-icon" href="./icon-512.png" />
        <link rel="manifest" href="./manifest.webmanifest" />
        <meta name="theme-color" content="#202329" />
        <meta name="mobile-web-app-capable" content="yes" />
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                background: #000;
                overflow: hidden;
                -webkit-user-select: none;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
                touch-action: none;
                overscroll-behavior: none;
            }
            #game {
                display: block;
                position: absolute;
                width: 100vw;
                height: calc(100vw * 9 / 16);
                max-width: calc(100vh * 16 / 9);
                max-height: 100vh;
            }
            /* Shares the canvas's letterboxed box. z-index puts it over the game but
               under the splash, so a cutscene can never show through the loading screen. */
            #movie {
                display: block;
                position: absolute;
                width: 100vw;
                height: calc(100vw * 9 / 16);
                max-width: calc(100vh * 16 / 9);
                max-height: 100vh;
                z-index: 5;
                background: #000;
                object-fit: contain;
            }
            #movie[hidden] {
                display: none;
            }
            /* Shares the canvas's letterboxed box, same as #movie above - the loading art sits
               exactly where the game will. Faded rather than removed on ready, so the canvas
               underneath is already painted when it goes; pointer-events keeps the invisible
               overlay from eating taps. */
            #betterLoader {
                display: block;
                position: absolute;
                width: 100vw;
                height: calc(100vw * 9 / 16);
                max-width: calc(100vh * 16 / 9);
                max-height: 100vh;
                background: #202329 url("./loading/loader-logo.webp") center / cover no-repeat;
                z-index: 10;
                transition: opacity 0.25s ease-out;
            }
            #betterLoader.hidden {
                opacity: 0;
                pointer-events: none;
            }
            #track {
                position: absolute;
                left: 36.15%;
                top: 91.67%;
                width: 27.08%;
                height: 3.24%;
                border-radius: 20px;
                background: linear-gradient(to bottom, #c6c6c6 0%, #d6d6d6 100%);
                overflow: hidden;
            }
            #progress {
                width: 0%;
                height: 100%;
                background: url("./loading/load-repeat.webp") repeat-x;
                background-size: auto 100%;
                border-radius: 18px;
                transition: width 0.3s ease-out;
            }
            #splash-hint {
                position: absolute;
                left: 50%;
                bottom: 6%;
                transform: translateX(-50%);
                max-width: 320px;
                padding: 0 24px;
                margin: 0;
                text-align: center;
                font-size: 0.8rem;
                line-height: 1.45;
                color: #e6e6e6;
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
                opacity: 0.75;
            }
            #splash-hint[hidden] {
                display: none;
            }
            #update {
                padding: 20px 24px;
                border: 0;
                border-radius: 10px;
                background: #202329;
                color: #e6e6e6;
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
                box-shadow: 0 8px 32px rgb(0 0 0 / 50%);
            }
            #update::backdrop {
                background: rgb(0 0 0 / 50%);
            }
            #update p {
                margin: 0 0 16px;
            }
            #update-actions {
                display: flex;
                gap: 8px;
                justify-content: flex-end;
            }
            #update button {
                padding: 8px 18px;
                font-size: 0.95rem;
                border: 0;
                border-radius: 6px;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <canvas id="game"></canvas>
        <video id="movie" playsinline hidden></video>
        <div id="betterLoader">
            <div id="track"><div id="progress"></div></div>
            <p id="splash-hint" role="status" hidden>
                Taking too long? You might want to check your internet speed, or
                reload the page.
            </p>
        </div>
        <dialog id="update">
            <p>A new version of the game is ready.</p>
            <div id="update-actions">
                <button id="update-later">Later</button>
                <button id="update-now">Update</button>
            </div>
        </dialog>
        <script type="module" src="./pwa.js"></script>
        <script type="module">
            // Loading has two stretches with no reporting of their own - compiling what was
            // downloaded, and decoding the audio - so a slow device and a wedged one look alike
            // from here. The advice waits out a comfortably slow start rather than accusing
            // every one of them of being broken.
            const HINT_DELAY_MS = 30000;

            const hint = document.getElementById("splash-hint");
            const hintTimer = setTimeout(() => {
                hint.hidden = false;
            }, HINT_DELAY_MS);

            // No Play button: the game boots straight in once ready. Audio unlocks itself on
            // the player's first click/keypress anywhere on the page (see audio.js), fading in
            // rather than snapping to full volume, since that first gesture can land well after
            // gameplay is already visible.
            globalThis.ctrdxReady = () => {
                clearTimeout(hintTimer);
                document.getElementById("betterLoader")?.classList.add("hidden");
            };
        </script>
        <script type="module" src="./main.js"></script>
    </body>
</html>
