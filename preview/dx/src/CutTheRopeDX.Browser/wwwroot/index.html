<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <title>Cut the Rope: DX - Web Edition</title>
        <link rel="icon" type="image/x-icon" href="./favicon.ico" />
        <link rel="apple-touch-icon" href="./icon-512.png" />
        <link rel="manifest" href="./manifest.webmanifest" />
        <meta name="theme-color" content="#202329" />
        <meta name="mobile-web-app-capable" content="yes" />
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                background: transparent;
                overflow: hidden;
                -webkit-user-select: none;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
                touch-action: none;
                overscroll-behavior: none;
            }
            /* Centered explicitly: width/height alone leave the box pinned to the top-left
               corner once either max-width or max-height clamps it off the full viewport. */
            #game {
                display: block;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 100vw;
                height: calc(100vw * 9 / 16);
                max-width: calc(100vh * 16 / 9);
                max-height: 100vh;
            }
            /* Shares the canvas's letterboxed box. z-index puts it over the game but
               under the splash, so a cutscene can never show through the loading screen. */
            #movie {
                display: block;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 100vw;
                height: calc(100vw * 9 / 16);
                max-width: calc(100vh * 16 / 9);
                max-height: 100vh;
                z-index: 5;
                background: #000;
                object-fit: contain;
            }
            #movie[hidden] {
                display: none;
            }
            /* Shares the canvas's letterboxed box, same as #movie above - the loading art sits
               exactly where the game will. Faded rather than removed on ready, so the canvas
               underneath is already painted when it goes; pointer-events keeps the invisible
               overlay from eating taps. Transparent outside the loader-logo image itself, same
               as html/body, so an embedding page shows through anywhere the game isn't actually
               drawing something - everything except gameplay itself, once it starts. */
            #betterLoader {
                display: block;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 100vw;
                height: calc(100vw * 9 / 16);
                max-width: calc(100vh * 16 / 9);
                max-height: 100vh;
                background: url("./loading/loader-logo.webp") center / cover no-repeat;
                z-index: 10;
                transition: opacity 0.25s ease-out;
            }
            #betterLoader.hidden {
                opacity: 0;
                pointer-events: none;
            }
            #track {
                position: absolute;
                left: 36.15%;
                top: 91.67%;
                width: 27.08%;
                height: 3.24%;
                border-radius: 20px;
                background: linear-gradient(to bottom, #c6c6c6 0%, #d6d6d6 100%);
                overflow: hidden;
            }
            #progress {
                width: 0%;
                height: 100%;
                background: url("./loading/load-repeat.webp") repeat-x;
                background-size: auto 100%;
                border-radius: 18px;
                transition: width 0.3s ease-out;
            }
            #splash-hint {
                position: absolute;
                left: 50%;
                bottom: 6%;
                transform: translateX(-50%);
                max-width: 320px;
                padding: 0 24px;
                margin: 0;
                text-align: center;
                font-size: 0.8rem;
                line-height: 1.45;
                color: #e6e6e6;
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
                opacity: 0.75;
            }
            #splash-hint[hidden] {
                display: none;
            }
        </style>
    </head>
    <body>
        <canvas id="game"></canvas>
        <video id="movie" playsinline hidden></video>
        <div id="betterLoader">
            <div id="track"><div id="progress"></div></div>
            <p id="splash-hint" role="status" hidden>
                Taking too long? You might want to check your internet speed, or
                reload the page.
            </p>
        </div>
        <script type="module">
            // No PWA/service-worker here - this build is a level-editor preview embed, not an
            // installable app: each load is a different `?data=` level, there is nothing sane
            // to precache for "offline", and the worker's asset-integrity checks are exactly
            // what breaks under any dev proxy that rewrites the HTML in flight (e.g. VS Code's
            // Live Preview injecting its live-reload script changes index.html's bytes, so its
            // hash no longer matches what the worker recorded at publish time - SRI then blocks
            // the fetch outright). Unregistering covers a worker installed by an earlier build
            // that did register one, since a registration outlives the page that made it.
            navigator.serviceWorker?.getRegistrations().then((regs) => {
                for (const reg of regs) reg.unregister();
            });

            // Loading has two stretches with no reporting of their own - compiling what was
            // downloaded, and decoding the audio - so a slow device and a wedged one look alike
            // from here. The advice waits out a comfortably slow start rather than accusing
            // every one of them of being broken.
            const HINT_DELAY_MS = 30000;

            const hint = document.getElementById("splash-hint");
            const hintTimer = setTimeout(() => {
                hint.hidden = false;
            }, HINT_DELAY_MS);

            // No Play button: the game boots straight in once ready. Audio unlocks itself on
            // the player's first click/keypress anywhere on the page (see audio.js), fading in
            // rather than snapping to full volume, since that first gesture can land well after
            // gameplay is already visible.
            globalThis.ctrdxReady = () => {
                clearTimeout(hintTimer);
                document.getElementById("betterLoader")?.classList.add("hidden");
            };
        </script>
        <script type="module" src="./main.js"></script>
    </body>
</html>
