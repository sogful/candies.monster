<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover"
        />
        <title>Cut the Rope: DX - Web Edition</title>
        <link rel="icon" type="image/x-icon" href="./favicon.ico" />
        <link rel="apple-touch-icon" href="./icon-512.png" />
        <link rel="manifest" href="./manifest.webmanifest" />
        <meta name="theme-color" content="#202329" />
        <meta name="mobile-web-app-capable" content="yes" />
        <style>
            html,
            body {
                height: 100%;
                margin: 0;
                background: transparent;
                overflow: hidden;
                -webkit-user-select: none;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
                touch-action: none;
                overscroll-behavior: none;
            }
            /* No top/left/transform here on purpose: glcontext.js's resizeViewportSurfaces()
               already computes pixel-perfect centering (fitCanvasToViewport) and sets it as
               inline style.left/top on this element every resize - CSS centering on top of that
               would double-offset it, since the inline styles win over the stylesheet but a
               stylesheet transform still applies on top of them. */
            #game {
                display: block;
                position: absolute;
                width: 100vw;
                height: calc(100vw * 9 / 16);
                max-width: calc(100vh * 16 / 9);
                max-height: 100vh;
            }
            /* Shares the canvas's letterboxed box (same caveat: positioned by glcontext.js, not
               CSS). z-index puts it over the game but under the splash, so a cutscene can never
               show through the loading screen. */
            #movie {
                display: block;
                position: absolute;
                width: 100vw;
                height: calc(100vw * 9 / 16);
                max-width: calc(100vh * 16 / 9);
                max-height: 100vh;
                z-index: 5;
                background: #000;
                object-fit: contain;
            }
            #movie[hidden] {
                display: none;
            }
            /* Shares the canvas's letterboxed box, same as #movie above - the loading art sits
               exactly where the game will. Faded rather than removed on ready, so the canvas
               underneath is already painted when it goes; pointer-events keeps the invisible
               overlay from eating taps. Transparent outside the loader-logo image itself, same
               as html/body, so an embedding page shows through anywhere the game isn't actually
               drawing something - everything except gameplay itself, once it starts. */
            #betterLoader {
                display: block;
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 100vw;
                height: calc(100vw * 9 / 16);
                max-width: calc(100vh * 16 / 9);
                max-height: 100vh;
                background: url("./loading/loader-logo.png") center / cover no-repeat;
                z-index: 10;
                transition: opacity 0.25s ease-out;
            }
            #betterLoader.hidden {
                opacity: 0;
                pointer-events: none;
            }
            /* Positioned to sit exactly over the empty bar already drawn into loader-logo.png
               (measured from the source image: pixel rect [691,982]-[1227,1034] of 1920x1080).
               The image also bakes in its own "this might take a bit" caption just below the
               bar, so there's no separate hint element here - it'd have nowhere to go in that
               same tight margin without overlapping, and would just repeat what the image
               already says. */
            #track {
                position: absolute;
                left: 35.99%;
                top: 90.93%;
                width: 27.92%;
                height: 4.81%;
                border-radius: 20px;
                overflow: hidden;
            }
            #progress {
                width: 0%;
                height: 100%;
                background: url("./loading/load-repeat.webp") repeat-x;
                background-size: auto 100%;
                border-radius: 18px;
                transition: width 0.3s ease-out;
            }
        </style>
    </head>
    <body>
        <canvas id="game"></canvas>
        <video id="movie" playsinline hidden></video>
        <div id="betterLoader">
            <div id="track"><div id="progress"></div></div>
        </div>
        <script type="module">
            // No PWA/service-worker here - this build is a level-editor preview embed, not an
            // installable app: each load is a different `?data=` level, there is nothing sane
            // to precache for "offline", and the worker's asset-integrity checks are exactly
            // what breaks under any dev proxy that rewrites the HTML in flight (e.g. VS Code's
            // Live Preview injecting its live-reload script changes index.html's bytes, so its
            // hash no longer matches what the worker recorded at publish time - SRI then blocks
            // the fetch outright). Unregistering covers a worker installed by an earlier build
            // that did register one, since a registration outlives the page that made it.
            navigator.serviceWorker?.getRegistrations().then((regs) => {
                for (const reg of regs) reg.unregister();
            });

            // No Play button: the game boots straight in once ready. Audio unlocks itself on
            // the player's first click/keypress anywhere on the page (see audio.js), fading in
            // rather than snapping to full volume, since that first gesture can land well after
            // gameplay is already visible.
            globalThis.ctrdxReady = () => {
                document.getElementById("betterLoader")?.classList.add("hidden");
            };
        </script>
        <script type="module" src="./main.js"></script>
    </body>
</html>
