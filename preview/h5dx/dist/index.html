                function decodebase64utf8(str) {
                    let cleaned = str.replace(/\s/g, "");
                    cleaned = cleaned.replace(/-/g, "+").replace(/_/g, "/");
                    while (cleaned.length % 4 !== 0) {
                        cleaned += "=";
                    }
                    const binarystring = atob(cleaned);

                    const bytes = new Uint8Array(binarystring.length);
                    for (let i = 0; i < binarystring.length; i++) {
                        bytes[i] = binarystring.charCodeAt(i);
                    }

                    const decoder = new TextDecoder("utf-8");
                    return decoder.decode(bytes);
                }

                function cleanurl() {
                    const url = new URL(window.location.href);
                    url.searchParams.delete("data");
                    window.history.replaceState({}, "", url.toString());
                }

                function tryloadcustomlevel() {
                    const dataparam = new URLSearchParams(window.location.search).get("data");
                    if (!dataparam) {
                        return;
                    }

                    try {
                        const xmldata = decodebase64utf8(dataparam);
                        const customlevel = convertxmltojson(xmldata);
                        if (customlevel) {
                            window.__CTR_CUSTOM_LEVEL__ = customlevel;
                        }
                    } catch (error) {
                        console.error("failed to load custom level:", error);
                    } finally {
                        cleanurl();
                    }
                }

                function postPreviewMessage(kind, message) {
                    try {
                        if (window.parent && window.parent !== window) {
                            window.parent.postMessage(
                                {
                                    source: "preview-game",
                                    kind,
                                    game: "h5dx",
                                    message,
                                },
                                "*"
                            );
                        }
                    } catch (error) {
                        console.warn("preview message error:", error);
                    }
                }

                function formatErrorArgs(args) {
                    return args
                        .map((arg) => {
                            if (typeof arg === "string") return arg;
                            try {
                                return JSON.stringify(arg);
                            } catch (_) {
                                return String(arg);
                            }
                        })
                        .join(" ");
                }

                tryloadcustomlevel();

                const ogerror = console.error;
                console.error = function (...args) {
                    ogerror.apply(console, args);
                    postPreviewMessage("console-error", formatErrorArgs(args));
                };

                window.addEventListener("error", function (event) {
                    const shownerror = `${event.error?.name || "Error"}: ${event.message} at ${event.filename}:${event.lineno}:${event.colno}`;
                    postPreviewMessage("window-error", shownerror);
                });

                window.addEventListener("unhandledrejection", function (event) {
                    const shownerror = `Unhandled Promise Rejection: ${event.reason}`;
                    postPreviewMessage("unhandled-rejection", shownerror);
                });
            })();
