<!DOCTYPE html>
<html lang="en" class="scorepage">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>..excluding cheaters, of course! – candies.monster</title>
    <link rel="canonical" href="https://candies.monster/leaderboards/">

    <link rel="icon" href="/assets/images/candies/favicon.png">
    <link rel="preload" href="/assets/fonts/gooddog.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/assets/static/css/buttons.css">
    <link rel="stylesheet" href="/leaderboards/src/style.css">
    <script src="/assets/static/js/text/fonts.js"></script>
    <script async src="/assets/static/js/global.js"></script>
    <link rel="stylesheet" href="/assets/static/css/back.css">
    <script defer src="/assets/static/js/back.js"></script>

</head>
<body class="leaderboardpage">
    <a class="backlink pageback" href="/" aria-label="Back">
        <img src="/assets/images/buttons/back.png" alt="" width="36" height="36">
    </a>
    <header class="scoreheader">
        <h1 class="scoreheading">Google Play Leaderboards</h1>
    </header>
    <main class="scorepanel">
        <nav class="scoreboxes" aria-label="Boxes"></nav>
        <div class="scorestatus" role="status"></div>
        <table class="scoretable" hidden>
            <thead><tr><th scope="col">Rank</th><th scope="col">Player</th><th scope="col">Score</th></tr></thead>
            <tbody class="scorerows"></tbody>
        </table>
    </main>
    <audio class="click" src="/assets/audio/tap.mp3" preload="none"></audio>
    <script src="/leaderboards/src/index.js" type="module"></script>
</body>
</html>
