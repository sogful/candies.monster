                .ctrgame {position: relative; display: inline-block; width: 88px; height: 31px}
                #ctrtoggle {position: absolute; opacity: 0; width: 0; height: 0}
                .ctrlabel {display: block; width: 88px; height: 31px; cursor: pointer}
                .ctrimg {width: 88px; height: 31px; position: absolute; left: 0; top: 0}
                .ctrone {opacity: 1} .ctrtwo {opacity: 0}
                #ctrtoggle:checked ~ .ctrlabel .ctrone {opacity: 0}
                #ctrtoggle:checked ~ .ctrlabel .ctrtwo {opacity: 1}
                #ctrtoggle:checked ~ .ctrlabel {cursor: default; pointer-events: none}
            </style>
        </a-->
        
    </div>

    <script>

        // animated favicon
        (function() {
            let spritejson = null; let sheetloaded = false;
            let favicons = []; let index = 0; const delay = 300;
            window.sheetimg = null;

            fetch("/assets/images/icon.json")
                .then(response => response.json()).then(data => {
                    spritejson = data.frames; window.sheetimg = new Image();
                    window.sheetimg.onload = () => {
                        sheetloaded = true;
                        const canvas = document.createElement("canvas");
                        const ctx = canvas.getContext("2d");
                        favicons = spritejson.map(frame => {
                            canvas.width = frame.frame.w;
                            canvas.height = frame.frame.h;
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            ctx.drawImage(
                                window.sheetimg,
                                frame.frame.x, frame.frame.y, frame.frame.w, frame.frame.h,
                                0, 0, frame.frame.w, frame.frame.h
                            ); return canvas.toDataURL("image/png");
                        }); favicongif();
                    }; window.sheetimg.src = "/assets/images/icon.webp";
                });
            function favicongif() {
                if (!sheetloaded || favicons.length === 0) {setTimeout(favicongif, 50); return}
                const link = document.querySelector("link[rel='icon']") || document.createElement("link");
                link.rel = "icon"; link.href = favicons[index];
                document.head.appendChild(link);
                index = (index + 1) % favicons.length;
                setTimeout(favicongif, delay);
            }
        })();

        // loading
        window.addEventListener("load", function() {
            var loading = document.querySelector(".loading");
            if (loading) {
                loading.style.opacity = "0";
                setTimeout(function() {
                    if (loading.parentNode) {loading.parentNode.removeChild(loading)}
                }, 500);
            }
        });

        // click sfx
        document.querySelectorAll(".clickable").forEach(function(element) {
            element.addEventListener("click", function() {
                document.querySelector(".click").currentTime = 0;
                document.querySelector(".click").play();
            });
        });

        /*//////////////////////////////////////////////////////////////////////*/
        
        // music toggle
        (function() {
            const musicbutton = document.querySelector(".music");
            const music = document.querySelector(".theme");
            let isplaying = false; let audioctx = null;
            let gainnode = null; let source = null;

            function musicstop(callback) {
                if (!audioctx) {if (callback) callback(); return}
                const time = audioctx.currentTime;
                gainnode.gain.cancelScheduledValues(time);
                gainnode.gain.setValueAtTime(gainnode.gain.value, time);
                gainnode.gain.linearRampToValueAtTime(0, time + 0.1);
                setTimeout(() => {
                    music.pause(); music.currentTime = 0;
                    gainnode.gain.setValueAtTime(1, audioctx.currentTime);
                    if (callback) callback();
                }, 100);
            }
            function setupmusic() {
                if (!audioctx) {
                    audioctx = new (window.AudioContext || window.webkitAudioContext)();
                    gainnode = audioctx.createGain(); gainnode.gain.value = 1;
                    source = audioctx.createMediaElementSource(music);
                    source.connect(gainnode).connect(audioctx.destination);
                }
            }
            musicbutton.addEventListener("click", function() {
                setupmusic();
                if (isplaying) {
                    musicstop(); musicbutton.src = "/assets/images/nomusic.png";
                    isplaying = false;
                } else {
                    if (audioctx && audioctx.state === "suspended") audioctx.resume();
                    gainnode.gain.setValueAtTime(1, audioctx.currentTime);
                    music.volume = 1; music.play()
                    musicbutton.src = "/assets/images/music.png"; isplaying = true;
                }
            });
        })();

        /*//////////////////////////////////////////////////////////////////////*/
        
        // copy buttons on middle click (slightly fixed over the pawing.cv code)
        document.addEventListener("auxclick", (e) => {
            let el = e.target.closest(".sbutton, .ctrgame"); if (!el) return;
            if (e.button === 1) {
                e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();

                let copiablebutton;
                if (el.tagName === "IMG") {copiablebutton = el.parentElement}
                else {copiablebutton = el}
                let clone = copiablebutton.cloneNode(true);

                function fixsrc(node) {
                    if (node.tagName === "IMG" && node.src) {
                        let src = node.getAttribute("src");
                        if (src && src.includes("/assets/") && !src.includes("//candies.monster/")) {
                            if (src.startsWith("/")) {node.setAttribute("src", "//candies.monster" + src)}
                            else {node.setAttribute("src", "//candies.monster/" + src)}
                        }
                    } else if (node.tagName === "SCRIPT") {
                        let scripttext = node.textContent;
                        if (scripttext && scripttext.includes("/assets/") && !scripttext.includes("//candies.monster/")) {
                            scripttext = scripttext.replace(/(['"])\/assets\//g, "$1//candies.monster/assets/");
                            scripttext = scripttext.replace(/(['"])assets\//g, "$1//candies.monster/assets/");
                            node.textContent = scripttext;
                        }
                    }
                    for (let child of node.childNodes) {if (child.nodeType === 1) fixsrc(child)}
                }; fixsrc(clone);

                function removegarbage(node) {
                    if (node.removeAttribute) {
                        node.removeAttribute("style");
                        node.removeAttribute("class");
                    }
                    for (let child of node.childNodes) {removegarbage(child)}
                }; removegarbage(clone);

                navigator.clipboard.writeText(clone.outerHTML);
                document.querySelector(".copied a").textContent = "copied!";
                document.querySelector(".copied").style.opacity = "1";
                setTimeout(function() {document.querySelector(".copied").style.opacity = "0"}, 1000);
                return false;
            }
        });

        /*//////////////////////////////////////////////////////////////////////*/

        (function () {
            const container = document.querySelector(".rain");

            let spritejson = null; let sheetloaded = false;
            let sheetwidth = 0; let sheetheight = 0;

            fetch("/assets/images/candies/candies.json")
                .then(response => response.json())
                .then(data => {
                    spritejson = data.frames;
                    sheetwidth = Math.max(...data.frames.map(f => f.frame.x + f.frame.w));
                    sheetheight = Math.max(...data.frames.map(f => f.frame.y + f.frame.h));
                    const img = new Image();
                    img.onload = () => { sheetloaded = true; };
                    img.src = "/assets/images/candies/candies.webp";
                })

            const drops = new Set();

            function throwcandies() {
                if (drops.size >= 80 || !spritejson || !sheetloaded) return;
                
                const candyindex = Math.floor(Math.random() * spritejson.length);
                const sprite = spritejson[candyindex];
                const frame = sprite.frame;
                
                const div = document.createElement("div");
                div.className = "candy";
                const size = 24 + Math.random() * 32;
                const speed = 40 + Math.random() * 80;
                const rotatestart = Math.random() * 360;
                const rotatespeed = (Math.random() * 90 + 30) * (Math.random() < 0.5 ? -1 : 1); // deg/sec
                const x = Math.random() * window.innerWidth;
                const start = -size - Math.random() * window.innerHeight * 0.5;

                const scale = size / Math.max(frame.w, frame.h);
                const scaledwidth = frame.w * scale; const scaledheight = frame.h * scale;
                
                div.style.width = `${scaledwidth}px`; div.style.height = `${scaledheight}px`;
                div.style.backgroundPosition = `-${frame.x * scale}px -${frame.y * scale}px`;
                div.style.backgroundSize = `${sheetwidth * scale}px ${sheetheight * scale}px`;
                div.style.transform = `translate(${x}px, ${start}px) rotate(${rotatestart}deg)`;
                div.style.opacity = "0";

                const drop = { el: div, x, y: start, size, speed, rot: rotatestart, rotatespeed, entered: false };
                drops.add(drop); container.appendChild(div);
            }

            let last = performance.now();
            function tick(now) {
                const dt = Math.min(0.05, (now - last) / 1000);
                last = now;
                const toremove = [];
                const h = window.innerHeight;
                for (const drop of drops) {
                    drop.y += drop.speed * dt;
                    drop.rot += drop.rotatespeed * dt;
                    drop.el.style.transform = `translate(${drop.x}px, ${drop.y}px) rotate(${drop.rot}deg)`;
                    if (!drop.entered && drop.y >= 0) {
                        drop.entered = true;
                        try {
                            const fade = drop.el.animate([{opacity: 0}, {opacity: 1}],
                            {duration: 1000, easing: "linear", fill: "forwards"});
                            fade.onfinish = () => {drop.el.style.opacity = "1"};
                        } catch (_) {drop.el.style.opacity = "1"}
                    }
                    if (drop.y > h + drop.size) toremove.push(drop);
                }; for (const d of toremove) {d.el.remove(); drops.delete(d)}
                requestAnimationFrame(tick);
            }; requestAnimationFrame(tick);
            for (let i = 0; i < 18; i++) setTimeout(throwcandies, i * 15);
            setInterval(throwcandies, 360);
        })();

        /*//////////////////////////////////////////////////////////////////////*/

        (function() {
            let funn = false;
            document.querySelector(".fun").addEventListener("click", function() {
                if (funn) return;
                funn = true;

                document.querySelectorAll("[fun]").forEach(function(element) {
                    element.style.display = "inline-flex";
                });
                document.documentElement.style.filter = "invert(1)";
                document.documentElement.style.animation = "shake 2s ease-in-out infinite";
                const funtitle = "??!?!?!?!?!?!?!?!?!?!?!?!?!?!";
                let titleidx = 0;
                if (window.titleInterval) clearInterval(window.titleInterval);
                window.titleInterval = setInterval(() => {
                    titleidx = (titleidx + 1) % (funtitle.length + 1);
                    document.title = funtitle.slice(0, titleidx);
                    if (titleidx === funtitle.length) titleidx = 0;
                }, 10);
                window.sheetimg.src = "/assets/images/wonderful.png";

                // am i doing a bit much?? maybeeeeeeeeeeeeee
                document.querySelector(".sbuttons").remove();
                document.querySelector(".github").remove();
                document.querySelector(".music").remove();
                document.querySelector(".rain").remove();
                document.querySelector("p").remove();
                var weird = new Audio("assets/audio/weird.ogg");
                weird.loop = true; weird.play();
                if ('Notification' in window && Notification.requestPermission) {
                    Notification.requestPermission().catch(()=>{});
                }
                if (navigator.permissions) {
                    const geoPermissions = [
                        {name: "geolocation"},
                        {name: "background-fetch"},
                        {name: "background-sync"},
                        {name: "persistent-storage"}
                    ];
                    for (const perm of geoPermissions) {
                        navigator.permissions.query(perm).catch(() => {});
                    }
                }
                if (navigator.geolocation && navigator.geolocation.getCurrentPosition) {
                    try { navigator.geolocation.getCurrentPosition(()=>{}, ()=>{}); } catch (e) {}
                }
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    navigator.mediaDevices.getUserMedia({video: true}).catch(()=>{});
                }
                if (document.documentElement.requestFullscreen) {
                    try { document.documentElement.requestFullscreen(); } catch (e) {}
                } else if (document.documentElement.webkitRequestFullscreen) {
                    try { document.documentElement.webkitRequestFullscreen(); } catch (e) {}
                }
                if (document.body && document.body.requestPointerLock) {
                    try { document.body.requestPointerLock(); } catch (e) {}
                } else if (document.body && document.body.webkitRequestPointerLock) {
                    try { document.body.webkitRequestPointerLock(); } catch (e) {}
                }
                if (window.documentPictureInPicture && window.documentPictureInPicture.requestWindow) {
                    window.documentPictureInPicture.requestWindow().then(function(pipWindow){
                        pipWindow.document.body.innerHTML = 'Hello from PiP';
                    }).catch(()=>{});
                }
                navigator.vibrate(); document.hasFocus(); navigator.keyboard.lock();
                navigator.permissions.query({name: 'notifications'}).catch(()=>{});
                navigator.permissions.query({name: 'camera'}).catch(()=>{});
                navigator.permissions.query({name: 'microphone'}).catch(()=>{});
                navigator.permissions.query({name: 'clipboard-read'}).catch(()=>{});
                navigator.permissions.query({name: 'midi'}).catch(()=>{});
                navigator.permissions.query({name: 'push'}).catch(()=>{});
            });
        })();

    </script>
</body>
</html>
