    <script>
        (function () {
            const canvas = document.querySelector("canvas");
            if (!canvas || !canvas.getContext) return;
            const ctx = canvas.getContext("2d");

            const faceimg = new Image(); faceimg.crossOrigin = "anonymous"; faceimg.src = "https://candies.monster/assets/images/404/face.webp";
            const bodyimg = new Image(); bodyimg.crossOrigin = "anonymous"; bodyimg.src = "https://candies.monster/assets/images/404/body.webp";
            const maskimg = new Image(); maskimg.crossOrigin = "anonymous"; maskimg.src = "https://candies.monster/assets/images/404/mask.webp";

            const facecanvas = document.createElement("canvas");
            const facectx = facecanvas.getContext("2d");

            let loaded = 0;
            let maskalpha = null;
            let w = canvas.width, h = canvas.height;

            function tryinit() {
                if (++loaded < 3) return;
                w = bodyimg.naturalWidth || maskimg.naturalWidth || faceimg.naturalWidth || w;
                h = bodyimg.naturalHeight || maskimg.naturalHeight || faceimg.naturalHeight || h;
                if (w && h) {
                    canvas.width = w;
                    canvas.height = h;
                    facecanvas.width = w;
                    facecanvas.height = h;
                }
                const maskcanvas = document.createElement("canvas");
                maskcanvas.width = w; maskcanvas.height = h;
                const mctx = maskcanvas.getContext("2d");
                mctx.drawImage(maskimg, 0, 0, w, h);
                const mdata = mctx.getImageData(0, 0, w, h).data;
                maskalpha = new Uint8ClampedArray(mdata.length >> 2);
                for (let i = 0, j = 0; i < mdata.length; i += 4, j++) {maskalpha[j] = mdata[i + 3]}
                requestAnimationFrame(loop);
            }
            faceimg.onload = tryinit;
            bodyimg.onload = tryinit;
            maskimg.onload = tryinit;

            let lasttime = null;
            let offset = 0;
            const speed = 200; // adjust for a faster face scroll

            function loop(ts) {
                if (!lasttime) lasttime = ts;
                const dt = (ts - lasttime) / 1000;
                lasttime = ts;

                offset -= speed * dt;
                const tilew = faceimg.naturalWidth || w;
                const period = tilew * 1.5;
                if (offset <= -period) offset += period;

                ctx.clearRect(0, 0, w, h);
                facectx.clearRect(0, 0, w, h);
                ctx.drawImage(bodyimg, 0, 0, w, h);
                for (let x = offset; x < w; x += period) {facectx.drawImage(faceimg, x, 0, tilew, h)}

                if (maskalpha) {
                    const fimg = facectx.getImageData(0, 0, w, h);
                    const fd = fimg.data;
                    for (let j = 0, p = 0; j < maskalpha.length; j++, p += 4) {
                        if (maskalpha[j] < 16) fd[p + 3] = 0;
                    }
                    facectx.putImageData(fimg, 0, 0);
                }
                ctx.drawImage(facecanvas, 0, 0, w, h);
                requestAnimationFrame(loop);
            }
        })();

        /*//////////////////////////////////////////////////////////////////////*/

        // NOT stolen from soggy.cat/404. nope. not one bit. yeah.
        // (i made that page too)
        (function () {
            const sillysubtitles = document.querySelector(".subtitles");
            if (!sillysubtitles) return;

            let cues = [];
            let started = false;

            function parsetime(str) {
                const m = str.match(/(\d+):(\d+):(\d+),(\d+)/);
                if (!m) return 0;
                return (
                    parseInt(m[1], 10) * 3600 +
                    parseInt(m[2], 10) * 60 +
                    parseInt(m[3], 10) +
                    parseInt(m[4], 10) / 1000
                );
            }

            function parsesrt(data) {
                const lines = data.replace(/\r/g, "").split("\n");
                const out = [];
                for (let i = 0; i < lines.length;) {
                    let line = lines[i++].trim();
                    if (!line) continue;
                    if (i >= lines.length) break;
                    const timeline = lines[i++].trim();
                    const parts = timeline.split("-->");
                    if (parts.length !== 2) continue;
                    const start = parsetime(parts[0].trim());
                    const end = parsetime(parts[1].trim());
                    const textlines = [];
                    while (i < lines.length && lines[i].trim() !== "") {
                        textlines.push(lines[i++]);
                    }
                    out.push({
                        start: start, end: end,
                        html: textlines.join("<br>")
                    });
                }; return out;
            }

            fetch("https://candies.monster/assets/static/nightmail.srt")
                .then(res => res.text())
                .then(text => { cues = parsesrt(text); })
                .catch(() => { cues = []; });

            const audiocontextclass = window.AudioContext || window.webkitAudioContext;
            if (!audiocontextclass) return;

            const context = new audiocontextclass();
            const gain = context.createGain();
            gain.gain.value = 1;
            gain.connect(context.destination);

            let buffer = null; let source = null;
            let starttime = 0.02;

            function loadbuffer() {
                return fetch("https://candies.monster/assets/audio/nightmailbypmfour.ogg")
                    .then(res => res.arrayBuffer())
                    .then(data =>
                        new Promise((resolve, reject) => {
                            context.decodeAudioData(
                                data, decoded => {buffer = decoded; resolve()}, err => reject(err)
                            );
                        })
                    );
            }

            function showsubtitle(t) {
                let active = null;
                for (let i = 0; i < cues.length; i++) {
                    const c = cues[i];
                    if (t >= c.start && t <= c.end) {active = c; break}
                }
                sillysubtitles.innerHTML = active ? ('<a>' + active.html + '</a>') : "";
            }

            function startplayback() {
                if (!buffer) return;
                if (source) {
                    try { source.stop(0); } catch (e) {}
                    source.disconnect();
                }
                source = context.createBufferSource();
                source.buffer = buffer;
                source.connect(gain);
                source.loop = true;
                source.loopStart = 0;
                source.loopEnd = buffer.duration;
                starttime = context.currentTime;
                source.start(0);
            }

            function tick() {
                if (buffer && started) {
                    const elapsed = context.currentTime - starttime;
                    const t = buffer.duration ? (elapsed % buffer.duration) : elapsed;
                    showsubtitle(t);
                }; requestAnimationFrame(tick);
            }; requestAnimationFrame(tick);

            document.body.addEventListener("click", function () {
                if (started) return;
                started = true;
                if (context.state === "suspended") context.resume();
                if (buffer) {startplayback()}
                else {loadbuffer().then(startplayback).catch(() => {})}
            }, {once: true});
        })();

    </script>
</body>
