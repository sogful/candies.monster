        .loading {
            position: fixed; display: flex;
            justify-content: center;
            width: 100vw; height: 100vh; z-index: 65535;
            background-color: rgba(0,0,0,0.5);
            filter: drop-shadow(0 4px 12px rgba(0,0,0,0.33));
            transition: opacity 0.5s;
        }
        .loading svg {
            width: 100px;
            filter: drop-shadow(0 4px 12px rgba(0,0,0,/*0.55*/0.33));
            animation: rotate 2s linear infinite;
        }
        @keyframes rotate {
            0% {transform: rotate(0deg)}
            100% {transform: rotate(360deg)}
        }

        .tiny {
            position: fixed; bottom: 0.3em; width: 90%;
            text-align: center; line-height: 0.9;
            color: rgb(223, 223, 223); font-size: 0.61em;
            -webkit-text-stroke: 0.175em black;
            text-shadow: 0 0.15em 0 black;
            pointer-events: auto; padding-bottom: 5px;
            box-sizing: border-box; paint-order: stroke fill;
        }
        .tiny a {pointer-events: auto}
        .oldstuff {
            pointer-events: auto; text-align: right; opacity: 0.5;
            top: 0.3em !important; right: 0.3em !important;
        }

        /*//////////////////////////////////////////////////////////////////////*/

        .scrollnav {
            position: fixed; top: 50%; transform: translateY(-50%);
            display: flex; align-items: center; gap: 0.3em;
            z-index: 999; pointer-events: auto;
        }
        .scrollnav img {
            height: 2.2em; display: block;
        }
        .scrollnav span {
            color: white; font-size: 1em;
            -webkit-text-stroke: 0.175em black;
            text-shadow: 0 0.15em 0 black;
            paint-order: stroke fill;
            white-space: nowrap; user-select: none;
        }
        .scrollnav.right {right: 0.5em}
        .scrollnav.left {left: 0.5em}

        /*//////////////////////////////////////////////////////////////////////*/

        .sbutton {
            display: flex; position: fixed; flex-direction: column;
            align-items: center; justify-content: center;
            background: none; z-index: 999;
            border: none; padding: 0; bottom: 2.6em;
        }
        .sbutton img {height: 3em}

        .sbutton span {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #fff; font-size: 1.5em;
            -webkit-text-stroke: 0.15em black;
            text-shadow: 0 0.15em 0 black;
            paint-order: stroke fill;
            pointer-events: none;
            white-space: nowrap; user-select: none;
        }

        .backbutton {
            position: fixed;
            top: 0.5em; left: 0.5em; z-index: 99999999;
            display: none;
        }
        .backbutton.active {display: block}
        .backbutton img {height: 3em}

        @media (max-width: 650px) {
            .backbutton {
                top: auto;
                bottom: 0.5em !important;
            }
        }

        /*//////////////////////////////////////////////////////////////////////*/

        .container {
            position: relative;
            width: 100vw; height: 100vh; min-height: 100vh;
            overflow-x: auto; overflow-y: hidden;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }

        .gamepanels {
            display: flex; flex-direction: row;
            width: max-content; min-height: 100vh;
        }

        .gamescreen {
            position: relative; display: flex;
            flex: 0 0 100vw;
            width: 100vw; min-width: 100vw; height: 100vh;
            justify-content: center; align-items: center;
            transition: transform 0.5s ease-in-out;
            overflow: visible;
        }
        .gamescreen.slideleft {transform: translateX(-25vw)}
        
        @media (max-width: 650px) {
            .gamescreen {
                overflow-y: auto; overflow-x: hidden;
                align-items: flex-start;
            }
            .gamescreen.slideleft {
                transform: translateX(-100vw);
            }
        }

        .gamecircle {
            position: relative;
            width: min(90vw, 800px); height: min(90vh, 800px);
            min-height: 600px; display: flex;
            justify-content: center; align-items: center;
            margin: 0 auto; overflow: visible;
            transform-origin: center center;
            transition: opacity 0.2s ease;
        }
        .gamecircle.rendering {opacity: 0}
        
        @media (max-width: 650px) {
            .gamecircle {
                width: 100vw; top: 1em;
                height: auto;
                min-height: auto;
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(clamp(50px, calc(50px + 30 * ((100vw - 220px) / 380)), 80px), 1fr));
                gap: 0.25em; padding: 0.5em; padding-bottom: 10em;
                box-sizing: border-box;
                justify-content: start;
                align-items: flex-start;
            }
        }

        .gameicon {
            position: absolute;
            cursor: pointer;
            transition: transform 0.3s ease, filter 0.3s ease;
        }
        
        @media (max-width: 650px) {
            .gameicon {
                position: relative;
                width: clamp(50px, calc(50px + 30 * ((100vw - 220px) / 380)), 80px) !important;
                height: clamp(50px, calc(50px + 30 * ((100vw - 220px) / 380)), 80px) !important;
                left: auto !important;
                top: auto !important;
                margin: 0 auto;
            }
        }
        
        .gameicon img {
            width: 100%; height: 100%;
            object-fit: contain;
            border-radius: 20%;
        }

        /*//////////////////////////////////////////////////////////////////////*/

        .versionscreen {
            display: flex; flex-direction: column;
            position: fixed; z-index: 99999;
            right: 0; top: 0; left: auto; width: 50vw;
            height: 100vh; padding: 1em;
            overflow-y: auto; overflow-x: hidden;
            pointer-events: none; box-sizing: border-box;
            background-color: rgba(0,0,0,0); opacity: 0;
            transition: opacity 0.5s ease-in-out, background-color 0.5s ease-in-out;
        }
        
        @media (max-width: 650px) {
            .versionscreen {
                left: 0; right: 0; width: 100vw;
            }
        }
        .versionscreen.active {
            pointer-events: auto;
            background-color: rgba(0,0,0,0.5);
            opacity: 1;
        }

        .gameinfo {
            color: white;
            margin-bottom: 1em;
            -webkit-text-stroke: 0.175em black;
            text-shadow: 0 0.15em 0 black;
            paint-order: stroke fill;
        }
        .gameinfo .gamename {
            font-size: 2.5em; line-height: 0.75;
            margin-bottom: 0.2em;
            -webkit-text-stroke: 0.15em black;
            text-shadow: 0 0.125em 0 black;
            paint-order: stroke fill;
        }
        .gameinfo .package {
            font-size: 0.75em;
            color: rgba(255,255,255,0.8);
        }
        .gameinfo .description {
            font-size: 1em;
            color: white;
            margin-top: 0.5em;
        }

        /*//////////////////////////////////////////////////////////////////////*/
        
        .versionslist {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 0.5em; padding-right: 0.5em; padding-bottom: 3em;
            width: 100%; box-sizing: border-box;
        }
        .versionslist.multipackage {
            grid-template-columns: 1fr;
            gap: 2em;
        }
        .packagecolumn {
            display: flex;
            flex-direction: column;
        }
        .packagecolumn .packageversions {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 0.5em;
            padding-right: 0.5em;
            padding-bottom: 3em;
            width: 100%;
            box-sizing: border-box;
        }

        .versionpanel {
            display: flex; flex-direction: row;
            align-items: center; line-height: 0.75;
            padding-top: 0.25em; padding-bottom: 0.25em;
            box-sizing: border-box;
            min-width: 0;
        }

        .versionicon {
            width: 60px; height: 60px;
            flex-shrink: 0; border-radius: 20%;
            overflow: hidden; margin-right: 10px;
        }
        .versionicon img {
            width: 100%; height: 100%;
            object-fit: cover;
        }

        .versioninfo {
            flex: 1; min-width: 0;
            color: white;
            overflow: hidden; width: 0;
        }
        .gameinfo .packageicons {
            padding-top: 0.75em;
            display: flex; flex-wrap: wrap;
            align-items: center; gap: 2px;
        }
        .gameinfo .packageicons img {
            width: 32px; height: 32px;
            object-fit: cover;
        }
        .versioninfo .version {
            font-size: 1em;
            margin-bottom: 0.2em;
            -webkit-text-stroke: 0.175em black;
            text-shadow: 0 0.175em 0 black;
            paint-order: stroke fill;
        }
        .versioninfo .details {
            font-size: 0.8em;
            color: rgba(255,255,255,0.7);
            -webkit-text-stroke: 0.15em black;
            text-shadow: 0 0.15em 0 black;
            paint-order: stroke fill;
        }

        .versionbuttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3em;
            margin-top: 0.25em;
        }
        .versionbuttons img {
            height: 24px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .versionbuttons .cdnbutton {
            display: flex; align-items: center;
            gap: 0.15em; height: 24px;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%; min-width: 100%;
            flex-basis: 100%; order: -1;
        }
        .versionbuttons .cdnbutton img {
            height: 24px;
            flex-shrink: 0;
        }
        .versionbuttons .cdnbutton .cdntext {
            display: flex; flex-direction: column;
            justify-content: center;  line-height: 1.2;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.65em; white-space: nowrap;
            flex: 1; min-width: 0;
        }
        .versionbuttons .cdnbutton .cdntext > div {
            -webkit-text-stroke: 0.1em black;
            text-shadow: 0 0.1em 0 black;
            paint-order: stroke fill;
        }

    </style>
