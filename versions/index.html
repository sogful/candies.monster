        .gamescreen {
            position: absolute; display: flex;
            justify-content: center; align-items: center;
            width: 100vw; height: 100vh;
            left: 0; top: 0;
            transition: transform 0.5s ease-in-out;
            overflow: visible;
        }
        .gamescreen.slideleft {
            transform: translateX(-25vw);
        }

            .gamescreen.slideleft {
                transform: translateX(-100vw);
            }
        }

        .gamecircle {
            position: relative;
            width: min(90vw, 800px);
            height: min(90vh, 800px);
            min-height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto;
            overflow: visible;
            transform-origin: center center;
            transition: opacity 0.2s ease;
        }
        
        .gamecircle.rendering {
            opacity: 0;
        }

            .gamecircle {
                width: 100vw; top: 1em;
                height: auto;
                min-height: auto;

                grid-template-columns: repeat(auto-fill, minmax(clamp(50px, calc(50px + 30 * ((100vw - 220px) / 380)), 80px), 1fr));
                gap: 0.25em; padding: 0.5em;
                box-sizing: border-box;
                justify-content: start;
                align-items: flex-start;
            }
        }

        .gameicon {
            position: absolute;
            cursor: pointer;
            transition: transform 0.3s ease, filter 0.3s ease;
        }
        
        @media (max-width: 600px) {
            .gameicon {
                position: relative;
                width: clamp(50px, calc(50px + 30 * ((100vw - 220px) / 380)), 80px) !important;
                height: clamp(50px, calc(50px + 30 * ((100vw - 220px) / 380)), 80px) !important;
                left: auto !important;
                top: auto !important;
                margin: 0 auto;
            }
        }
        
        .gameicon img {
            width: 100%; height: 100%;
            object-fit: contain;
            border-radius: 20%;
        }

        .versionscreen {
            display: flex; flex-direction: column;

            left: 50vw; width: 50vw;
            height: 100vh; padding: 1em;
            overflow-y: auto; overflow-x: hidden;
            pointer-events: none; box-sizing: border-box;
            background-color: rgba(0,0,0,0); opacity: 0;
            transition: opacity 0.5s ease-in-out, background-color 0.5s ease-in-out;

        @media (max-width: 600px) {
            .versionscreen {
                left: 0; width: 100vw;
            }

        .versionscreen.active {
            pointer-events: auto;
            background-color: rgba(0,0,0,0.5);

            margin-top: 0.5em;

            width: 100%; box-sizing: border-box;

        .versionpanel {
            display: flex; flex-direction: row;
            align-items: center; line-height: 0.75;
            padding-top: 0.25em; padding-bottom: 0.25em;
            box-sizing: border-box;
            min-width: 0;

        .versionicon {
            width: 60px; height: 60px;
            flex-shrink: 0; border-radius: 20%;
            overflow: hidden; margin-right: 10px;

        .versionicon img {
            width: 100%; height: 100%;

        .versioninfo {
            flex: 1; min-width: 0;

            overflow: hidden; width: 0;

        .versioninfo .version {
            font-size: 1em;
            margin-bottom: 0.2em;
            -webkit-text-stroke: 0.175em black;
            text-shadow: 0 0.175em 0 black;
            paint-order: stroke fill;
        }
        .versioninfo .details {
            font-size: 0.8em;
            color: rgba(255,255,255,0.7);
            -webkit-text-stroke: 0.15em black;
            text-shadow: 0 0.15em 0 black;
            paint-order: stroke fill;
        }

        .versionbuttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3em;
            margin-top: 0.25em;
        }
        .versionbuttons img {
            height: 24px;
            cursor: pointer;
            transition: transform 0.2s;
        }

    <script>
        
        // animated favicon
        (function() {
            let spritejson = null; let sheetloaded = false;
            let favicons = []; let index = 0; const delay = 300;
            let sheetimg = null;

            fetch("/assets/images/icon.json")
                .then(response => response.json()).then(data => {
                    spritejson = data.frames; sheetimg = new Image();
                    sheetimg.onload = () => {
                        sheetloaded = true;
                        const canvas = document.createElement("canvas");
                        const ctx = canvas.getContext("2d");
                        favicons = spritejson.map(frame => {
                            canvas.width = frame.frame.w;
                            canvas.height = frame.frame.h;
                            ctx.clearRect(0, 0, canvas.width, canvas.height);
                            ctx.drawImage(
                                sheetimg,
                                frame.frame.x, frame.frame.y, frame.frame.w, frame.frame.h,
                                0, 0, frame.frame.w, frame.frame.h
                            ); return canvas.toDataURL("image/png");
                        }); favicongif();
                    }; sheetimg.src = "/assets/images/icon.webp";
                });
            function favicongif() {
                if (!sheetloaded || favicons.length === 0) {setTimeout(favicongif, 50); return}
                const link = document.querySelector("link[rel='icon']") || document.createElement("link");
                link.rel = "icon"; link.href = favicons[index];
                document.head.appendChild(link);
                index = (index + 1) % favicons.length;
                setTimeout(favicongif, delay);
            }
        })();

        // loading
        window.addEventListener("load", function() {
            var loading = document.querySelector(".loading");
            if (loading) {
                loading.style.opacity = "0";
                setTimeout(function() {
                    if (loading.parentNode) {loading.parentNode.removeChild(loading)}
                }, 500);
            }
        });

        // click sfx
        document.querySelectorAll(".clickable").forEach(function(element) {
            if (element.classList.contains("backbutton")) return;
            element.addEventListener("click", function() {
                const clicksfx = document.querySelector(".click");
                if (clicksfx) {
                    clicksfx.currentTime = 0;
                    clicksfx.play().catch(() => {});
                }
            });
        });

        /*//////////////////////////////////////////////////////////////////////*/

        // these mappings are handy
        const buttonmap = [
            {domain: "apkmirror.com", icon: "apkmirror.png"},
            {domain: "apkpure.com", icon: "apkpure.png"},
            {domain: "uptodown.com", icon: "uptodown.png"},
            {domain: "apkcombo.com", icon: "apkcombo.png"},
            {domain: "pdalife.to", icon: "pdalife.png"},
            {domain: "archive.org", icon: "internetarchive.png"}
        ];

        function autobutton(url) {
            for (let i = 0; i < buttonmap.length; i++) {
                if (url.includes(buttonmap[i].domain))
                    return buttonmap[i].icon;
            } return "other.png";
        }

        /*//////////////////////////////////////////////////////////////////////*/

        let games = [];
        let currentgame = null;

        async function loadgames() {
            try {
                const res = await fetch("games.json");
                games = await res.json();
                requestAnimationFrame(() => {setTimeout(() => {rendergamecircle()}, 50)});
            } catch (e) {}
        }

        function rendergamecircle() {
            const circle = document.getElementById("gamecircle");
            circle.classList.add("rendering");
            circle.innerHTML = "";
            const sorted = [...games].sort((a, b) => b.importance - a.importance);
            const tinyscreen = window.innerWidth < 600;
            
            if (tinyscreen) {
                sorted.forEach((g) => {
                    const ic = document.createElement("div");
                    ic.className = "gameicon clickable";
                    ic.dataset.gameid = g.id;
                    const im = document.createElement("img");
                    im.src = g.icon;
                    im.draggable = false;
                    im.onerror = function() {this.src = '/assets/images/gameicons/idk.webp'};
                    ic.appendChild(im);
                    ic.addEventListener("click", () => {
                        const s = document.querySelector(".click");
                        if (s) {
                            s.currentTime = 0;
                            s.play().catch(() => {});
                        } selectgame(g);
                    });
                    circle.appendChild(ic);
                });
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        circle.classList.remove("rendering");
                    });
                });
            } else {
                const circlerect = circle.getBoundingClientRect();
                const w = circlerect.width > 0 ? circlerect.width : Math.min(window.innerWidth * 0.9, 800);
                const h = circlerect.height > 0 ? circlerect.height : Math.max(Math.min(window.innerHeight * 0.9, 800), 600);
                const cx = w / 2, cy = h / 2;
                const placed = [];
                sorted.forEach((g, i) => {
                    const ic = document.createElement("div");
                    ic.className = "gameicon clickable";
                    ic.dataset.gameid = g.id;
                    const sz = 50 + (g.importance - 3) * 5.7;
                    ic.style.width = `${sz}px`;
                    ic.style.height = `${sz}px`;
                    let x, y;
                    if (i === 0) {
                        x = cx - sz / 2;
                        y = cy - sz / 2;
                    } else {
                        const maximp = sorted[0].importance;
                        const minimp = sorted[sorted.length - 1].importance;
                        const imgrange = maximp - minimp;
                        let normimp;
                        if (imgrange <= 0) {
                            const denom = Math.max(1, sorted.length - 1);
                            normimp = 1 - (i / denom);
                        } else {
                            normimp = (g.importance - minimp) / imgrange;
                        }
                        const saferad = Math.min(w, h) * 0.4;
                        const minrad = sz * 0.65;
                        const maxrad = Math.min(sz * 2, saferad);
                        const rad = minrad + (1 - normimp) * (maxrad - minrad);
                        const gold = Math.PI * (3 - Math.sqrt(5));
                        const ang = (i - 1) * gold;
                        let tx = cx + Math.cos(ang) * rad;
                        let ty = cy + Math.sin(ang) * rad;
                        let ov = true, att = 0, maxatt = 50, pad = 12;
                        while (ov && att < maxatt) {
                            ov = false;
                            for (const pl of placed) {
                                const dx = tx - pl.x, dy = ty - pl.y;
                                const dist = Math.sqrt(dx * dx + dy * dy);
                                const mindist = (sz + pl.size) / 2 + pad;
                                if (dist < mindist) {
                                    ov = true;
                                    if (dist > 0) {
                                        const pdist = (mindist - dist) + 1;
                                        const pang = Math.atan2(dy, dx);
                                        tx += Math.cos(pang) * pdist;
                                        ty += Math.sin(pang) * pdist;
                                    } else {
                                        const ran = Math.random() * Math.PI * 2;
                                        tx += Math.cos(ran) * (mindist + 1);
                                        ty += Math.sin(ran) * (mindist + 1);
                                    }
                                    const half = sz / 2;
                                    tx = Math.max(half, Math.min(w - half, tx));
                                    ty = Math.max(half, Math.min(h - half, ty));
                                    break;
                                }
                            } att++;
                        }
                        if (ov) {
                            const pad = 12;
                            const maxsr = Math.min(w, h) * 0.5;
                            const rstep = sz * 0.4;
                            const astep = Math.PI / 12;
                            outer:
                            for (let r = minrad; r <= maxsr; r += rstep) {
                                for (let a = 0; a < Math.PI * 2; a += astep) {
                                    const cx2 = cx + Math.cos(a) * r;
                                    const cy2 = cy + Math.sin(a) * r;
                                    let cov = false;
                                    for (const pl of placed) {
                                        const dx = cx2 - pl.x, dy = cy2 - pl.y;
                                        const dist = Math.sqrt(dx * dx + dy * dy);
                                        const mindist = (sz + pl.size) / 2 + pad;
                                        if (dist < mindist) {cov = true; break}
                                    }
                                    if (!cov) {
                                        tx = cx2;
                                        ty = cy2;
                                        ov = false;
                                        break outer;
                                    }
                                }
                            }
                        } x = tx - sz / 2; y = ty - sz / 2;
                    }
                    x = Math.max(0, Math.min(w - sz, x));
                    y = Math.max(0, Math.min(h - sz, y));
                    ic.style.left = `${x}px`;
                    ic.style.top = `${y}px`;
                    ic.style.position = 'absolute';
                    placed.push({ x: x + sz / 2, y: y + sz / 2, size: sz });
                    const im = document.createElement("img");
                    im.src = g.icon;
                    im.draggable = false;
                    im.onerror = function() {this.src = '/assets/images/gameicons/idk.webp'};
                    ic.appendChild(im);
                    ic.addEventListener("click", () => {
                        const s = document.querySelector(".click");
                        if (s) {
                            s.currentTime = 0;
                            s.play().catch(() => {});
                        } selectgame(g);
                    }); circle.appendChild(ic);
                });
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        circle.classList.remove("rendering");
                    });
                });
            }
        }

        async function selectgame(g) {
            currentgame = g;
            const gs = document.getElementById("gamescreen");
            const vs = document.getElementById("versionscreen");
            const bb = document.querySelector(".backbutton");
            gs.classList.add("slideleft");
            vs.classList.add("active");
            bb.classList.add("active");
            await loadversions(g.id);
        }

        let legacyctriconmap = null;
        async function loadlegacyctricons() {
            if (legacyctriconmap) return legacyctriconmap;
            try {
                const res = await fetch("versions.json");
                const legacy = await res.json();
                const m = {};
                legacy.forEach(en => {
                    if (en && en.version && en.icon) {m[String(en.version)] = en.icon}
                });
                legacyctriconmap = m;
            } catch (e) {legacyctriconmap = {}}
            return legacyctriconmap;
        }

        function parseversion(s) {
            let v = s.replace(/^v/, '');
            const p = v.split('.');
            // VERY GOOD SOLUTION 🤑🤑🤑🤑🤑🤑🤑
            // if (p.length > 0 && !p[0].includes('3') && parseInt(p[0]) > 10) {v = '3.' + v}
            return v.split('.').map(n => parseInt(n) || 0);
        }

        async function loadversions(gid) {
            try {
                const res = await fetch(`jsons/${gid}.json`);
                let vlist = await res.json();
                
                const versionmap = new Map();
                vlist.forEach(ver => {
                    const versionkey = ver.version;
                    if (versionmap.has(versionkey)) {
                        const existing = versionmap.get(versionkey);
                        const alldownloads = [...(existing.downloads || []), ...(ver.downloads || [])];
                        const seenurls = new Set();
                        const uniquedownloads = [];
                        alldownloads.forEach(d => {
                            if (d && d.url && !seenurls.has(d.url)) {
                                seenurls.add(d.url);
                                uniquedownloads.push(d);
                            }
                        });
                        existing.downloads = uniquedownloads;
                        if (!existing.icon && ver.icon) existing.icon = ver.icon;
                        if (!existing.details && ver.details) existing.details = ver.details;
                    } else {
                        versionmap.set(versionkey, {...ver});
                    }
                });
                vlist = Array.from(versionmap.values());
                
                vlist.sort((a, b) => {
                    const av = parseversion(a.version);
                    const bv = parseversion(b.version);
                    for (let i = 0; i < Math.max(av.length, bv.length); i++) {
                        const an = av[i] || 0;
                        const bn = bv[i] || 0;
                        if (bn !== an) return bn - an;
                    }
                    return 0;
                });
                const gi = document.getElementById("gameinfo");
                const ga = games.find(g => g.id === gid);
                gi.innerHTML = `
                    <div class="gamename">${ga.name}</div>
                    <div class="package">${ga.package}</div>
                    ${ga.description ? `<div class="description">${ga.description}</div>` : ''}
                `;
                const vl = document.getElementById("versionslist");
                vl.innerHTML = "";
                let ctmap = null;
                if (gid === "ctr") {ctmap = await loadlegacyctricons()}
                vlist.forEach(ver => {
                    const pn = document.createElement("div");
                    pn.className = "versionpanel";
                    let iconp = null;
                    if (ctmap && ctmap[ver.version]) {iconp = ctmap[ver.version]}
                    else if (ver.icon) {iconp = ver.icon}
                    else if (ga && ga.icon) {iconp = ga.icon}
                    else {iconp = "/assets/images/gameicons/free.webp"}
                    const unq = []; const seen = new Set();
                    (ver.downloads || []).forEach(d => {
                        if (!d || !d.url) return;
                        if (seen.has(d.url)) return;
                        seen.add(d.url);
                        unq.push(d);
                    });
                    pn.innerHTML = `
                        <div class="versionicon">
                            <img src="${iconp}" draggable="false">
                        </div>
                        <div class="versioninfo">
                            <div class="version">${ver.version}</div>
                            ${ver.details ? `<div class="details">${ver.details}</div>` : ''}
                            <div class="versionbuttons">
                                ${unq.map(d => 
                                    `<a href="${d.url}" target="_blank" class="clickable">
                                        <img src="/assets/images/dlbuttons/${d.button || autobutton(d.url)}" draggable="false">
                                    </a>`
                                ).join("")}
                            </div>
                        </div>
                    `;
                    vl.appendChild(pn);
                });
                document.querySelectorAll(".clickable").forEach(function(e) {
                    e.addEventListener("click", function() {
                        document.querySelector(".click").currentTime = 0;
                        document.querySelector(".click").play();
                    });
                });
            } catch (e) {
                const vl = document.getElementById("versionslist");
                vl.innerHTML = `<div style="color: white; -webkit-text-stroke: 0.125em black; text-shadow: 0 0.1em 0 black;">No versions found for this game.</div>`;
            }
        }

        function goback() {
            if (!currentgame) return;
            const gs = document.getElementById("gamescreen");
            const vs = document.getElementById("versionscreen");
            const bb = document.querySelector(".backbutton");
            gs.classList.remove("slideleft");
            vs.classList.remove("active");
            bb.classList.remove("active");
            currentgame = null;
        }

        function setupbackbutton() {
            const bb = document.querySelector(".backbutton");
            if (bb) {
                bb.addEventListener("click", function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    const c = document.querySelector(".click");
                    if (c) {c.currentTime = 0; c.play().catch(() => {})} goback();
                });
            }
        }

        if (document.readyState === 'loading') {document.addEventListener('DOMContentLoaded', setupbackbutton)}
        else {setupbackbutton()}
        loadgames();

        let resizet;
        window.addEventListener("resize", () => {
            clearTimeout(resizet);
            resizet = setTimeout(() => {
                if (!currentgame) {
                    rendergamecircle();
                }
            }, 250);
        });
        window.addEventListener("load", () => {
            requestAnimationFrame(() => {
                setTimeout(() => {
                    if (!currentgame && games.length > 0) {
                        rendergamecircle();
                    }
                }, 150);
            });
        });
                
    </script>
</body>
</html>
